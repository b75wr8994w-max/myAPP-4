                eth: data.ethereum?.twd || prev.eth, 
                ada: data.cardano?.twd || prev.ada,

        const cash = displayAssets.twd + displayAssets.emergency + displayAssets.entertainment;

        <div style="color: var(--text-dim);">進度推進狀態：<span id="overall-progress">0%</span></div>
    </header>

    <div class="map-container" id="map">
        <div class="progress-line" id="progress-line" style="width: 0%;"></div>
        
        <div class="node" id="node-1" onclick="showNodeInfo(1)">
            <div class="node-circle">1</div>
            <div class="node-title">任務點 1：基礎防線</div>
            <div class="node-target">NT$ 10,000,000</div>
        </div>
        
        <div class="node" id="node-2" onclick="showNodeInfo(2)">
            <div class="node-circle">2</div>
            <div class="node-title">任務點 2：資產擴張</div>
            <div class="node-target">NT$ 30,000,000</div>
        </div>
        
        <div class="node" id="node-3" onclick="showNodeInfo(3)">
            <div class="node-circle">3</div>
            <div class="node-title">任務點 3：終極座標</div>
            <div class="node-target">NT$ 90,000,000</div>
        </div>
    </div>

    <div class="dashboard">
        <div class="panel" id="action-panel">
            <h2>資產變動指令</h2>
            <input type="number" id="amount-input" placeholder="輸入台幣金額..." min="0">
            <button onclick="updateAssets('add')">增加資金 (注入燃料)</button>
            <button class="btn-danger" onclick="updateAssets('sub')">扣除資金 (重大消費)</button>
        </div>

        <div class="panel">
            <h2>戰略節點資訊</h2>
            <div id="info-display">
                <p style="color: var(--text-dim);">點擊上方地圖節點以讀取詳細戰略目標與執行協議。</p>
            </div>
        </div>
    </div>

    <div class="terminal" id="terminal-log"></div>
</div>

<script>
    // 系統常數與節點設定
    const nodes = [
        {
            id: 1,
            target: 10000000,
            title: "基礎防線",
            desc: "確保家庭開銷、育兒品質與情緒防線 100% 充裕。僅在毫無壓力的前提下，將『絕對閒置資金』轉換為 BTC 燃料。"
        },
        {
            id: 2,
            target: 30000000,
            title: "資產擴張",
            desc: "主要依賴現有金庫的自我解壓縮。若山寨幣未能提供轉換爆發力，隨時準備啟動熔斷協議，全數斬倉轉入 VOO 穩定桶獲取實體配息。"
        },
        {
            id: 3,
            target: 90000000,
            title: "2047 終極座標",
            desc: "達成財務自由標準。啟動雙金庫物理隔離防禦協議，死守最終傳承給咪波的 0.3 顆 BTC 星際權杖絕對底線。"
        }
    ];

    let currentAssets = 0;

    // 初始化載入
    function init() {
        const savedData = localStorage.getItem('wealth_map_save');
        if (savedData) {
            currentAssets = parseInt(savedData, 10);
        }
        updateUI();
        logTerminal("系統初始化完成。戰略地圖已載入。");
    }

    // 格式化數字
    function formatMoney(amount) {
        return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(amount);
    }

    // 更新介面與地圖狀態
    function updateUI() {
        document.getElementById('display-total').textContent = formatMoney(currentAssets);
        
        let maxTarget = nodes[2].target;
        let progressPercent = Math.min((currentAssets / maxTarget) * 100, 100);
        document.getElementById('overall-progress').textContent = progressPercent.toFixed(2) + '%';
        document.getElementById('progress-line').style.width = `calc(${progressPercent}% - 40px)`;

        nodes.forEach((node, index) => {
            const el = document.getElementById(`node-${node.id}`);
            el.classList.remove('active', 'completed');
            
            if (currentAssets >= node.target) {
                el.classList.add('completed');
            } else if (index === 0 || currentAssets >= nodes[index-1].target) {
                el.classList.add('active');
            }
        });

        localStorage.setItem('wealth_map_save', currentAssets);
    }

    // 顯示節點詳細資訊 (解決點擊白屏問題，改為原地更新內容)
    function showNodeInfo(nodeId) {
        const node = nodes.find(n => n.id === nodeId);
        const diff = node.target - currentAssets;
        const statusHTML = diff > 0 
            ? `<span style="color: var(--danger)">距離目標尚缺：${formatMoney(diff)}</span>`
            : `<span style="color: var(--accent)">狀態：已達成 ✓</span>`;

        document.getElementById('info-display').innerHTML = `
            <h3 style="color: var(--text-main); margin-top: 0;">${node.title}</h3>
            <p style="color: var(--accent); font-size: 1.1em;">目標金額：${formatMoney(node.target)}</p>
            <p>${statusHTML}</p>
            <p style="color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 10px;">
                <strong>戰略協議：</strong><br>${node.desc}
            </p>
        `;
        logTerminal(`存取節點 ${nodeId} (${node.title}) 資訊檔案。`);
    }

    // 處理資產增減
    function updateAssets(action) {
        const inputStr = document.getElementById('amount-input').value;
        const amount = parseInt(inputStr, 10);
        
        if (isNaN(amount) || amount <= 0) {
            alert("請輸入有效的金額");
            return;
        }

        if (action === 'add') {
            currentAssets += amount;
            logTerminal(`注入資金：+ ${formatMoney(amount)}`);
        } else if (action === 'sub') {
            // 防護機制：24 小時冷靜期提醒
            if (confirm(`【系統警告】\n任何突發的重大消費或決策衝動，請確認已啟動「24 小時冷靜期」。\n\n確定要扣除 ${formatMoney(amount)} 嗎？`)) {
                currentAssets = Math.max(0, currentAssets - amount);
                logTerminal(`扣除資金 (重大消費)：- ${formatMoney(amount)}`);
            } else {
                logTerminal(`已攔截消費行為：啟動 24 小時冷靜期協議。`);
                return;
            }
        }

        document.getElementById('amount-input').value = '';
        updateUI();
    }

    // 終端機日誌系統
    function logTerminal(message) {
        const terminal = document.getElementById('terminal-log');
        const now = new Date();
        const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
        
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-time">[${timeStr}]</span> ${message}`;
        
        terminal.appendChild(entry);
        terminal.scrollTop = terminal.scrollHeight;
    }

    // 啟動應用程式
    window.onload = init;
</script>

</body>
</html>
