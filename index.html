<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>財富霸業 - 實體隔離防禦版</title>

  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 載入 React 與 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 載入 Babel (讓瀏覽器即時翻譯 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_GAME_STATE = {
      assets: { twd: 100000, emergency: 200000, entertainment: 50000, btc: 0, eth: 0, ada: 0, qqq: 0, voo: 0, debt: 0 },
      merit: 300, 
      ownedOfficers: [],
      investCount: 0,
      lastInvestMonth: "",
      lastRoutineMonth: "", 
      logs: []
    };

    const FALLBACK_PRICES = { btc: 2050000, eth: 95000, ada: 12.5, qqq: 14500, voo: 15500 };

    const RANDOM_EVENTS = [
      { title: '天降祥瑞', msg: '境內出現白鹿祥瑞，軍心大振！', merit: 1 },
      { title: '風調雨順', msg: '今年氣候宜人，屯田豐收，後勤無虞。', merit: 1 },
      { title: '名士來投', msg: '有狂士路過大營，獻上奇策。', merit: 1 },
      { title: '平穩度日', msg: '本月天下太平，無事發生，穩步發展。', merit: 0 },
      { title: '流言蜚語', msg: '城中散佈著對將軍不利的流言，花費心力安撫。', merit: -1 },
      { title: '糧草受潮', msg: '連日大雨導致部分備用糧草發霉，軍心微挫。', merit: -1 }
    ];

    const PROVINCES = [
      { id: 'wancheng', name: '宛城', title: '築牆積糧', targetLabel: '雙防禦滿血', req: { emergency: 200000, entertainment: 50000 }, x: 50, y: 55 },
      { id: 'xuchang', name: '許昌', title: '百廢待興', targetLabel: '債務清零', req: { debt: 0 }, x: 58, y: 48 },
      { id: 'xiangyang', name: '襄陽', title: '主力成型', targetLabel: 'BTC 3 顆', req: { btc: 3 }, x: 52, y: 65 },
      { id: 'changan', name: '長安', title: '關中霸主', targetLabel: 'VOO 200 萬', req: { voo: 2000000 }, x: 40, y: 45 },
      { id: 'luoyang', name: '洛陽', title: '天下歸心', targetLabel: '兵力 1 億', req: { netWorth: 100000000 }, x: 48, y: 42 },
      { id: 'chengdu', name: '成都', title: '西蜀天險', targetLabel: 'QQQ 200 萬', req: { qqq: 2000000 }, x: 22, y: 68 },
      { id: 'jiangxia', name: '江夏', title: '初具規模', targetLabel: '兵力 300 萬', req: { netWorth: 3000000 }, x: 60, y: 70 },
      { id: 'hanzhong', name: '漢中', title: '中原逐鹿', targetLabel: '兵力 1000 萬', req: { netWorth: 10000000 }, x: 30, y: 50 },
      { id: 'jianye', name: '建業', title: '江東霸業', targetLabel: '兵力 3000 萬', req: { netWorth: 30000000 }, x: 78, y: 62 },
      { id: 'ye', name: '鄴城', title: '河北霸主', targetLabel: '兵力 8000 萬', req: { netWorth: 80000000 }, x: 60, y: 32 }
    ];

    const RAW_OFFICERS = [
      { id: 1, name: '曹操', stat: 98, type: '統帥' }, { id: 2, name: '司馬懿', stat: 99, type: '智力' }, { id: 3, name: '郭嘉', stat: 98, type: '智力' },
      { id: 5, name: '張遼', stat: 92, type: '統帥' }, { id: 26, name: '劉備', stat: 80, type: '仁德' }, { id: 27, name: '諸葛亮', stat: 100, type: '智力' }, 
      { id: 28, name: '關羽', stat: 97, type: '武力' }, { id: 29, name: '張飛', stat: 98, type: '武力' }, { id: 30, name: '趙雲', stat: 96, type: '武力' },
      { id: 51, name: '孫權', stat: 85, type: '統帥' }, { id: 52, name: '周瑜', stat: 96, type: '智力' }, { id: 76, name: '呂布', stat: 100, type: '武力' }, 
      { id: 77, name: '貂蟬', stat: 95, type: '魅力' }
    ];

    const OFFICERS = RAW_OFFICERS.map(o => {
      let faction = '群'; let color = 'text-gray-300'; let bg = 'bg-gray-900'; let border = 'border-gray-600';
      if (o.id <= 25) { faction = '魏'; color = 'text-blue-300'; bg = 'bg-blue-950/60'; border = 'border-blue-700'; }
      else if (o.id <= 50) { faction = '蜀'; color = 'text-green-300'; bg = 'bg-green-950/60'; border = 'border-green-700'; }
      else if (o.id <= 75) { faction = '吳'; color = 'text-red-300'; bg = 'bg-red-950/60'; border = 'border-red-700'; }
      return { ...o, faction, color, bg, border };
    });

    const BONDS = [
      { id: 'taoyuan', name: '桃園結義', req: [26, 28, 29], desc: '劉關張齊聚。每次徵兵額外 +3 軍功。', bonusPayday: 3, bonusRoutine: 0 },
      { id: 'wolongfengchu', name: '英雄美人', req: [76, 77], desc: '呂布與貂蟬。每月巡視額外 +3 軍功。', bonusPayday: 0, bonusRoutine: 3 }
    ];

    const TITLES = [
      { rank: '平民', min: 0 }, { rank: '縣令', min: 1000000 }, { rank: '太守', min: 3000000 },
      { rank: '刺史', min: 10000000 }, { rank: '州牧', min: 30000000 }, { rank: '大將軍', min: 50000000 },
      { rank: '魏王', min: 80000000 }, { rank: '皇帝', min: 100000000 }
    ];

    const ICONS = {
      Castle: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M4 21h16v-6h-2v4H6v-4H4v6zm14-10V5l-6 3-6-3v6l6 3 6-3z"/></svg>,
      Scroll: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><line x1="10" x2="16" y1="6" y2="6"/><line x1="10" x2="16" y1="10" y2="10"/></svg>,
      Map: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>,
      Tent: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 21h18M12 3l9 18M12 3L3 21"/><path d="M12 3v18M8 13h8"/></svg>,
      Users: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      Link: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
    };

    function App() {
      // 核心：從本機 LocalStorage 讀取存檔
      const [gameState, setGameState] = useState(() => {
        const saved = localStorage.getItem('wealth_game_save');
        return saved ? JSON.parse(saved) : DEFAULT_GAME_STATE;
      });
      
      const [prices, setPrices] = useState(FALLBACK_PRICES);
      const [investPlan, setInvestPlan] = useState({ amount: 10000, target: 'btc' });
      const [activeTab, setActiveTab] = useState('map');
      const [selectedProvinceId, setSelectedProvinceId] = useState(PROVINCES[0].id);
      const [syncStatus, setSyncStatus] = useState('本機實體隔離中');
      
      const [gachaResult, setGachaResult] = useState(null);
      const [activeEvent, setActiveEvent] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [localAssets, setLocalAssets] = useState(null);

      const realDate = new Date();
      const currentRealYear = realDate.getFullYear();
      const currentRealMonth = realDate.getMonth() + 1;
      const currentMonthString = `${currentRealYear}-${String(currentRealMonth).padStart(2, '0')}`;
      const jianAnYear = Math.max(0, currentRealYear - 2026);

      useEffect(() => {
        const fetchPrices = async () => {
          try {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,cardano&vs_currencies=twd');
            if (res.ok) {
              const data = await res.json();
              setPrices(prev => ({
                ...prev, btc: data.bitcoin?.twd || prev.btc, eth: data.ethereum?.twd || prev.eth, ada: data.cardano?.twd || prev.ada,
              }));
            }
          } catch (error) {}
        };
        fetchPrices();
      }, []);

      const { assets, merit, ownedOfficers, investCount, lastInvestMonth, lastRoutineMonth, logs } = gameState;
      const displayAssets = localAssets || assets;

      const stats = useMemo(() => {
        const crypto = (displayAssets.btc * prices.btc) + (displayAssets.eth * prices.eth) + (displayAssets.ada * prices.ada);
        const trad = displayAssets.qqq + displayAssets.voo;
        const cash = displayAssets.twd + displayAssets.emergency + displayAssets.entertainment;
        const netWorth = crypto + trad + cash - displayAssets.debt;
        return { crypto, trad, cash, netWorth };
      }, [displayAssets, prices]);

      const playerTitle = useMemo(() => {
        let currentTitle = TITLES[0].rank;
        for (let t of TITLES) { if (stats.netWorth >= t.min) currentTitle = t.rank; }
        return currentTitle;
      }, [stats.netWorth]);

      const officerBuff = useMemo(() => {
        let totalBuff = 0;
        ownedOfficers.forEach(id => {
          const off = OFFICERS.find(o => o.id === id);
          if (off) totalBuff += (off.stat / 100); 
        });
        return totalBuff;
      }, [ownedOfficers]);

      const activeBonds = useMemo(() => {
        return BONDS.filter(bond => bond.req.every(reqId => ownedOfficers.includes(reqId)));
      }, [ownedOfficers]);

      const bondPaydayBuff = useMemo(() => activeBonds.reduce((acc, bond) => acc + bond.bonusPayday, 0), [activeBonds]);
      const bondRoutineBuff = useMemo(() => activeBonds.reduce((acc, bond) => acc + bond.bonusRoutine, 0), [activeBonds]);

      const provincesState = useMemo(() => {
        return PROVINCES.map(prov => {
          let isMet = true;
          for (const [key, reqVal] of Object.entries(prov.req)) {
            let current = 0;
            if (key === 'netWorth') current = stats.netWorth;
            else if (key === 'investCount') current = investCount;
            else if (key === 'debt') current = displayAssets.debt;
            else current = displayAssets[key] || 0;
            if (key === 'debt') { if (current > reqVal) isMet = false; } else { if (current < reqVal) isMet = false; }
          }
          return { ...prov, isOccupied: isMet };
        });
      }, [displayAssets, stats, investCount]);

      const showToast = (msg, type = 'info') => {
        setToastMessage({ msg, type });
        setTimeout(() => setToastMessage(null), 3500);
      };

      // 核心：純本機存檔機制
      const saveGameState = (newState) => {
        setGameState(newState);
        localStorage.setItem('wealth_game_save', JSON.stringify(newState));
        setSyncStatus('本機已儲存');
        setTimeout(() => setSyncStatus('本機實體隔離中'), 2000);
      };

      const addLog = (newState, type, msg) => {
        const dateStr = `建安${jianAnYear}年${currentRealMonth}月`;
        newState.logs = [{ date: dateStr, type, msg }, ...(newState.logs || [])].slice(0, 50);
      };

      const handlePayday = () => {
        if (lastInvestMonth === currentMonthString) { showToast("本月軍令已下達！將軍，請靜候下月。", 'warn'); return; }
        if (investPlan.amount <= 0) { showToast("請輸入欲調度的糧草數量！", 'warn'); return; }
        if (!['btc', 'qqq', 'voo'].includes(investPlan.target)) { showToast("軍令錯誤：只能定投 BTC, QQQ, VOO。", 'error'); return; }

        let newState = JSON.parse(JSON.stringify(gameState));
        const amount = investPlan.amount;
        const target = investPlan.target;
        let addedAmount = amount;
        if (target === 'btc') addedAmount = amount / prices.btc;
        
        newState.assets[target] = (newState.assets[target] || 0) + addedAmount;
        newState.investCount += 1;
        newState.lastInvestMonth = currentMonthString;
        
        const ev = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
        let gainedMerit = 50 + officerBuff + bondPaydayBuff + ev.merit; 
        newState.merit += gainedMerit;
        
        const displayAdded = target === 'btc' ? addedAmount.toFixed(6) : addedAmount.toLocaleString();
        addLog(newState, '軍令', `徵兵令下：壯大 ${target.toUpperCase()} 營 ${displayAdded} 兵力。軍功 +${gainedMerit.toFixed(1)}。`);
        
        saveGameState(newState);
        setActiveEvent(ev); 
      };

      const executeRoutineTask = () => {
        if (lastRoutineMonth === currentMonthString) { showToast("本月已巡視過營地。", 'warn'); return; }
        let newState = JSON.parse(JSON.stringify(gameState));
        if (newState.assets.emergency >= 200000 && newState.assets.entertainment >= 50000) {
          let totalGained = 30 + bondRoutineBuff; 
          newState.merit += totalGained;
          newState.lastRoutineMonth = currentMonthString;
          addLog(newState, '內政', `糧草滿編，防禦陣地穩固，獲賞軍功 +${totalGained}。`);
          saveGameState(newState);
          showToast(`巡視完成，軍功 +${totalGained}`, 'success');
        } else {
          showToast("將軍，您的雙防禦尚未滿編！", 'error');
        }
      };

      const drawOfficer = () => {
        if (merit < 300) { showToast("軍功不足 300，無法設宴招賢！", 'warn'); return; }
        let newState = JSON.parse(JSON.stringify(gameState));
        const unowned = OFFICERS.filter(o => !newState.ownedOfficers.includes(o.id));
        if (unowned.length === 0) { showToast("天下英傑已盡歸麾下！", 'info'); return; }

        newState.merit -= 300; 
        const drawn = unowned[Math.floor(Math.random() * unowned.length)];
        newState.ownedOfficers.push(drawn.id);
        addLog(newState, '招賢', `耗費 300 軍功，登庸名將【${drawn.name}】！`);
        saveGameState(newState);
        setGachaResult(drawn);
      };

      const handleAssetChange = (key, val) => {
        if (!localAssets) setLocalAssets({ ...assets, [key]: val });
        else setLocalAssets({ ...localAssets, [key]: val });
      };

      const handleAssetBlur = () => {
        if (localAssets) {
          let newState = JSON.parse(JSON.stringify(gameState));
          newState.assets = localAssets;
          saveGameState(newState);
          setLocalAssets(null);
          showToast("帳冊已儲存於本機", 'success');
        }
      };

      const selectedProvince = provincesState.find(p => p.id === selectedProvinceId);
      const canInvestThisMonth = lastInvestMonth !== currentMonthString;
      const canDoRoutineThisMonth = lastRoutineMonth !== currentMonthString;
      const occupiedCount = provincesState.filter(p => p.isOccupied).length;

      return (
        <div className="h-screen w-full bg-[#0c0906] text-[#e3dac9] font-serif overflow-hidden flex flex-col relative selection:bg-[#4a3525] selection:text-white">
          <style dangerouslySetInnerHTML={{__html: `
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
            body { font-family: 'Noto Serif TC', serif; background-color: #0c0906; margin: 0; padding: 0; }
            .bg-wood { background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/></svg>'); }
            @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
            @keyframes stampIn { 0% { transform: scale(3) rotate(-15deg); opacity: 0; } 50% { transform: scale(0.8) rotate(5deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
          `}} />

          {toastMessage && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[200] animate-[slideUp_0.3s_ease-out]">
              <div className={`px-6 py-3 rounded-sm border shadow-2xl backdrop-blur-md font-bold tracking-widest text-sm flex items-center gap-2
                ${toastMessage.type === 'error' ? 'bg-[#3b0f0f]/90 text-red-300 border-red-800' : 
                  toastMessage.type === 'success' ? 'bg-[#0f291e]/90 text-green-300 border-green-800' : 
                  toastMessage.type === 'warn' ? 'bg-[#3b2d0f]/90 text-yellow-300 border-yellow-800' : 
                  'bg-[#0f172a]/90 text-blue-300 border-blue-800'}`}>
                {toastMessage.msg}
              </div>
            </div>
          )}

          {gachaResult && (
            <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/90 backdrop-blur-sm px-4" onClick={() => setGachaResult(null)}>
              <div className={`border-2 ${gachaResult.border} ${gachaResult.bg} w-full max-w-xs relative shadow-2xl animate-[stampIn_0.4s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]`}>
                <div className="absolute inset-0 bg-wood opacity-50 pointer-events-none mix-blend-multiply"></div>
                <div className={`absolute inset-0 flex items-center justify-center text-9xl font-black opacity-10 select-none pointer-events-none ${gachaResult.color}`}>
                  {gachaResult.faction}
                </div>
                <div className="relative z-10 flex flex-col items-center p-8">
                  <div className={`text-xs tracking-widest mb-4 font-bold border ${gachaResult.border} px-3 py-1 bg-black/50 ${gachaResult.color}`}>
                    【 {gachaResult.faction}軍將領 】
                  </div>
                  <h3 className={`text-4xl font-black mb-8 tracking-widest ${gachaResult.color} drop-shadow-lg`}>{gachaResult.name}</h3>
                  <div className="w-full bg-[#0a0705]/80 border border-[#3e2723] p-4 mb-4 backdrop-blur-sm">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-[#a3947c] text-sm">定位</span>
                      <span className="text-[#e3dac9] font-bold">{gachaResult.type} <span className={gachaResult.color}>{gachaResult.stat}</span></span>
                    </div>
                    <div className="flex justify-between items-center border-t border-[#3e2723] pt-2">
                      <span className="text-[#a3947c] text-sm">被動 (軍功/月)</span>
                      <span className="text-green-400 font-mono font-bold text-sm">+{((gachaResult.stat)/100).toFixed(2)}</span>
                    </div>
                  </div>
                  <p className="text-[#8c7e6a] text-xs mt-2 animate-pulse">點擊任意處收入麾下</p>
                </div>
              </div>
            </div>
          )}

          {activeEvent && !gachaResult && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm px-4">
              <div className="bg-[#1c1814] border-2 border-[#b8860b] w-full max-w-sm relative shadow-2xl animate-[slideUp_0.3s_ease-out]">
                <div className="absolute inset-0 bg-wood opacity-30 pointer-events-none"></div>
                <div className="p-4 border-b border-[#4a3525] flex justify-between items-center bg-[#0a0705]">
                  <h3 className="text-lg font-black tracking-widest text-[#d4af37]">邊關急報</h3>
                  <div className="w-5 h-5 text-[#d4af37]"><ICONS.Scroll className="w-full h-full"/></div>
                </div>
                <div className="p-6 relative z-10">
                  <h4 className="text-xl font-bold text-[#e3dac9] mb-3 text-center">{activeEvent.title}</h4>
                  <p className="text-[#a3947c] text-sm mb-6 text-center leading-relaxed bg-[#0a0705] p-3 border border-[#3e2723]">{activeEvent.msg}</p>
                  <div className="flex justify-center mb-6">
                    <div className={`px-6 py-2 text-base font-bold border rounded-sm shadow-inner
                      ${activeEvent.merit > 0 ? 'bg-[#0f291e] text-green-400 border-green-700' : 
                        activeEvent.merit < 0 ? 'bg-[#3b0f0f] text-red-400 border-red-700' : 'bg-[#1a1a1a] text-gray-400 border-gray-600'}`}>
                      軍功波動 {activeEvent.merit > 0 ? '+' : ''}{activeEvent.merit}
                    </div>
                  </div>
                  <button onClick={() => setActiveEvent(null)} className="w-full bg-[#2a2218] text-[#d4af37] border border-[#b8860b] font-bold py-3 text-sm hover:bg-[#3a2f22] active:scale-95 transition-all tracking-widest">
                    確認
                  </button>
                </div>
              </div>
            </div>
          )}

          <header className="bg-[#1a1410] border-b border-[#3e2723] shrink-0 z-40 shadow-xl relative">
            <div className="absolute inset-0 bg-wood opacity-30 pointer-events-none"></div>
            <div className="flex justify-between items-center px-4 py-3 relative z-10">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 border border-[#b8860b] bg-[#0a0705] flex flex-col items-center justify-center shadow-[inset_0_0_10px_rgba(184,134,11,0.2)]">
                  <span className="text-lg font-black text-[#e3dac9] leading-none mb-1">魏</span>
                  <span className="text-[9px] text-[#d4af37] bg-[#2a2218] px-1 border border-[#4a3525] rounded-sm whitespace-nowrap">{playerTitle}</span>
                </div>
                <div>
                  <h1 className="font-bold text-xl tracking-widest text-[#d4af37] drop-shadow-md">財富霸業</h1>
                  <div className="text-[10px] text-[#8c7e6a] flex items-center gap-1.5 mt-1 font-mono">
                    <span>建安{jianAnYear}年{currentRealMonth}月</span>
                    <span className={`text-[10px] ml-1 px-1 rounded-sm border ${syncStatus.includes('已儲存') ? 'border-green-500 text-green-400' : 'border-[#4a3525] text-[#8c7e6a]'}`}>{syncStatus}</span>
                  </div>
                </div>
              </div>
              <div className="text-right flex flex-col items-end justify-center">
                <div className="text-[10px] text-[#a3947c] tracking-widest mb-1">天下總兵力</div>
                <div className="text-2xl font-bold text-white font-mono drop-shadow-[0_0_5px_rgba(255,255,255,0.2)]">
                  {(stats.netWorth / 10000).toFixed(0)} <span className="text-xs text-[#d4af37] font-serif">萬</span>
                </div>
              </div>
            </div>
            <div className="flex px-4 py-2 gap-3 overflow-x-auto whitespace-nowrap scrollbar-hide text-[11px] font-mono bg-[#0a0705] border-t border-[#2a1a15] relative z-10 shadow-inner">
              <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-sm bg-[#1c1814] border border-[#3e2723]">
                <span className="text-[#a3947c] font-serif">軍功</span> <span className="text-[#ffd700] font-bold">{merit.toFixed(1)}</span>
              </div>
              <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-sm bg-[#1c1814] border border-[#3e2723]">
                <span className="text-[#a3947c] font-serif">糧草</span> <span className="text-[#4ade80]">{(stats.cash / 10000).toFixed(2)}w</span>
              </div>
              <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-sm bg-[#1c1814] border border-[#3e2723]">
                <span className="text-[#a3947c] font-serif">騎兵</span> <span className="text-[#60a5fa]">{(stats.crypto / 10000).toFixed(2)}w</span>
              </div>
              <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-sm bg-[#1c1814] border border-[#3e2723]">
                <span className="text-[#a3947c] font-serif">步兵</span> <span className="text-[#c084fc]">{(stats.trad / 10000).toFixed(2)}w</span>
              </div>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto relative bg-[#0a0705] scrollbar-hide">
            <div className="absolute inset-0 bg-wood opacity-20 pointer-events-none z-0"></div>
            <div className="relative z-10 w-full h-full flex flex-col">
              
              {activeTab === 'map' && (
                <div className="flex flex-col h-full">
                  <div className="flex-1 relative overflow-auto touch-pan-x touch-pan-y scrollbar-hide border-b border-[#3e2723] bg-[#080b0e]">
                    <div className="w-[1000px] h-[800px] relative">
                      <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-40" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="65%" cy="30%" rx="35%" ry="25%" fill="#1e3a8a" opacity="0.2" filter="blur(60px)" />
                        <ellipse cx="25%" cy="60%" rx="20%" ry="35%" fill="#14532d" opacity="0.2" filter="blur(60px)" />
                        <ellipse cx="75%" cy="70%" rx="30%" ry="25%" fill="#7f1d1d" opacity="0.2" filter="blur(60px)" />
                      </svg>
                      <div className="absolute inset-0 opacity-[0.05]" style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg width='60' height='103.92' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 60 25.98 L 30 8.66 L 0 25.98 L 0 58.91 L 30 76.23 L 60 58.91 Z' fill='none' stroke='%23ffffff' stroke-width='1'/%3E%3C/svg%3E")`, backgroundSize: '60px 103px' }}></div>
                      {provincesState.map(prov => (
                        <div key={prov.id} className="absolute transform -translate-x-1/2 -translate-y-1/2 cursor-pointer flex flex-col items-center group z-10"
                          style={{ left: `${prov.x}%`, top: `${prov.y}%` }} onClick={() => setSelectedProvinceId(prov.id)}>
                          <div className={`relative w-12 h-12 flex items-center justify-center transition-all duration-300
                            ${selectedProvinceId === prov.id ? 'scale-125 z-20 drop-shadow-[0_0_15px_rgba(212,175,55,0.8)]' : 'hover:scale-110'}
                            ${prov.isOccupied ? 'text-blue-400 drop-shadow-[0_0_8px_rgba(59,130,246,0.6)]' : 'text-gray-700'}`}>
                            <ICONS.Castle className="w-full h-full" />
                            {prov.isOccupied && <div className="absolute -top-1 -right-1 w-4 h-4 bg-blue-900 border border-blue-400 rounded-sm text-[9px] flex items-center justify-center font-bold text-white shadow-lg">魏</div>}
                            {selectedProvinceId === prov.id && <div className="absolute inset-[-8px] border border-[#d4af37] animate-ping rounded-full opacity-30"></div>}
                          </div>
                          <div className={`mt-1 px-2 py-0.5 text-[10px] md:text-xs font-bold border rounded-sm shadow-xl whitespace-nowrap tracking-widest backdrop-blur-sm
                            ${selectedProvinceId === prov.id ? 'bg-[#d4af37] text-black border-white' : prov.isOccupied ? 'bg-[#0f172a]/90 border-blue-600 text-blue-200' : 'bg-[#2a1111]/90 border-red-900 text-red-300'}`}>
                            {prov.name}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="h-48 bg-[#1a1410] border-t-2 border-[#b8860b] p-4 flex flex-col relative shrink-0 shadow-[0_-10px_20px_rgba(0,0,0,0.5)] z-20">
                    <div className="flex justify-between items-start mb-2">
                      <div>
                        <h2 className="text-[#d4af37] text-lg md:text-xl font-black tracking-widest flex items-center gap-2">
                          {selectedProvince.name}
                          <span className={`text-[9px] px-1.5 py-0.5 border rounded-sm font-bold ${selectedProvince.isOccupied ? 'text-blue-300 border-blue-500 bg-blue-900/50' : 'text-red-400 border-red-800 bg-red-950/50'}`}>
                            {selectedProvince.isOccupied ? '已壓制' : '敵軍割據'}
                          </span>
                        </h2>
                        <p className="text-[10px] md:text-xs text-[#a3947c] mt-1">{selectedProvince.title}</p>
                      </div>
                      <div className="text-right">
                        <div className="text-[10px] text-[#8c7e6a] tracking-widest">霸業進度</div>
                        <div className="font-mono text-[#e3dac9] text-base md:text-lg">{occupiedCount}<span className="text-[#8c7e6a] text-xs">/{PROVINCES.length}</span></div>
                      </div>
                    </div>
                    <div className="flex-1 mt-2 overflow-y-auto pr-2 scrollbar-hide">
                      <ul className="space-y-3">
                        {Object.entries(selectedProvince.req).map(([k, targetVal]) => {
                          let current = 0;
                          if (k === 'netWorth') current = stats.netWorth;
                          else if (k === 'investCount') current = investCount;
                          else if (k === 'debt') current = displayAssets.debt;
                          else current = displayAssets[k] || 0;
                          const isMet = k === 'debt' ? current <= targetVal : current >= targetVal;
                          const progress = k === 'debt' ? (current === 0 ? 100 : 0) : Math.min(100, (current / targetVal) * 100);
                          return (
                            <li key={k} className="flex flex-col">
                              <div className="flex justify-between mb-1 text-[10px] md:text-xs font-bold text-[#e3dac9]">
                                <span>{selectedProvince.targetLabel}</span>
                                <span className={isMet ? 'text-green-400' : 'text-red-400'}>{isMet ? '達成' : '未滿'}</span>
                              </div>
                              <div className="w-full bg-[#0a0705] h-1.5 rounded-full overflow-hidden border border-[#3e2723]">
                                <div className={`h-full transition-all duration-1000 ${isMet ? 'bg-green-500' : 'bg-red-800'}`} style={{ width: `${progress}%` }}></div>
                              </div>
                              <div className="flex justify-between mt-1 text-[#8c7e6a] text-[9px] font-mono">
                                <span>{current.toLocaleString(undefined, {maximumFractionDigits:2})}</span>
                                <span>/ {targetVal.toLocaleString()}</span>
                              </div>
                            </li>
                          );
                        })}
                      </ul>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'command' && (
                <div className="max-w-3xl mx-auto p-4 flex flex-col gap-4 pb-6 h-full overflow-y-auto w-full">
                  <div className="bg-[#1a1410] border border-[#4a3525] p-5 shadow-lg relative">
                    <div className="absolute top-0 left-0 w-1 h-full bg-[#b8860b]"></div>
                    <h2 className="text-[#d4af37] font-bold text-lg md:text-xl mb-4 tracking-widest flex items-center gap-2">
                      <ICONS.Tent className="w-5 h-5"/> 頒布徵兵令 (閒錢定投)
                    </h2>
                    <div className="bg-[#0a0705] p-3 md:p-4 border border-[#3e2723] mb-5">
                      <p className="text-[10px] md:text-xs text-[#a3947c] mb-4 leading-relaxed">
                        將軍，軍令僅為推進霸業與軍功，<span className="text-green-400 font-bold">絕不扣除法幣餘額</span>。<br/>
                        軍令標的僅限精銳部隊 (BTC, QQQ, VOO)。
                      </p>
                      <div className="flex flex-col gap-3">
                        <div>
                          <label className="text-[10px] md:text-xs text-[#8c7e6a] mb-1 block tracking-widest">調度糧草 (TWD等值)</label>
                          <input type="number" value={investPlan.amount === 0 ? '' : investPlan.amount} onChange={(e) => setInvestPlan({...investPlan, amount: parseFloat(e.target.value) || 0})}
                            className="w-full bg-[#1c1814] border border-[#4a3525] text-[#e3dac9] p-3 focus:outline-none focus:border-[#d4af37] font-mono text-base text-right rounded-sm" />
                        </div>
                        <div>
                          <label className="text-[10px] md:text-xs text-[#8c7e6a] mb-1 block tracking-widest">訓練精兵 (標的)</label>
                          <select value={investPlan.target} onChange={(e) => setInvestPlan({...investPlan, target: e.target.value})}
                            className="w-full bg-[#1c1814] border border-[#4a3525] text-[#e3dac9] p-3 focus:outline-none focus:border-[#d4af37] font-bold text-sm rounded-sm appearance-none">
                            <option value="btc">虎豹騎 (BTC) - 前期主力</option>
                            <option value="qqq">元戎弩 (QQQ) - 中期穩健</option>
                            <option value="voo">重步兵 (VOO) - 後期防禦</option>
                          </select>
                        </div>
                      </div>
                    </div>
                    <button onClick={handlePayday} disabled={!canInvestThisMonth}
                      className={`w-full py-3 md:py-4 font-black text-base md:text-lg border rounded-sm transition-all tracking-widest relative overflow-hidden
                        ${canInvestThisMonth ? 'bg-[#3b0f0f] text-red-100 border-red-700 hover:bg-[#5c0000] active:scale-95 shadow-[0_0_10px_rgba(139,0,0,0.5)]' : 'bg-[#1c1814] text-[#5c4033] border-[#3e2723] cursor-not-allowed'}`}>
                      <span className="relative z-10">{canInvestThisMonth ? '確認出兵' : '本月軍令已畢'}</span>
                    </button>
                    <div className="mt-3 flex justify-between items-center text-[10px] md:text-xs bg-[#0a0705] p-2 border border-[#2a1a15]">
                      <span className="text-[#a3947c]">武將被動: <span className="text-green-400">+{officerBuff.toFixed(2)}</span></span>
                      <span className="text-[#a3947c]">羈絆加成: <span className="text-yellow-400">+{bondPaydayBuff}</span></span>
                    </div>
                  </div>

                  <div className="bg-[#1a1410] border border-[#4a3525] p-4 shadow-lg flex justify-between items-center">
                    <div>
                      <h3 className="text-[#d4af37] font-bold text-sm md:text-base mb-1">日常巡視 (雙防禦)</h3>
                      <p className="text-[10px] text-[#8c7e6a]">檢閱預備金 20萬 & 娛樂金 5萬</p>
                    </div>
                    <button onClick={executeRoutineTask} disabled={!canDoRoutineThisMonth}
                      className={`px-4 py-2 text-xs md:text-sm font-bold border rounded-sm tracking-widest whitespace-nowrap
                        ${canDoRoutineThisMonth ? 'bg-[#0f291e] text-green-400 border-green-700 hover:bg-[#14532d] active:scale-95' : 'bg-[#0a0705] text-[#5c4033] border-[#3e2723] cursor-not-allowed'}`}>
                      {canDoRoutineThisMonth ? `檢閱領賞 (+${30 + bondRoutineBuff})` : '已巡視'}
                    </button>
                  </div>

                  <div className="bg-[#1a1410] border border-[#4a3525] p-4 shadow-lg flex-1 min-h-[200px] flex flex-col">
                    <h3 className="text-[#d4af37] text-sm md:text-base font-bold mb-3 flex items-center gap-2 border-b border-[#3e2723] pb-2 tracking-widest shrink-0">
                      <ICONS.Scroll className="w-4 h-4"/> 烽火紀年錄
                    </h3>
                    <div className="flex-1 overflow-y-auto pr-2 scrollbar-hide space-y-2">
                      {logs.length === 0 ? <p className="text-[#5c4033] text-center mt-6 text-xs">尚無戰事紀錄...</p> : 
                        logs.map((log, i) => (
                          <div key={i} className="flex gap-2 py-2 border-b border-[#2a1a15] items-start text-[10px] md:text-xs">
                            <span className="text-[#8c7e6a] shrink-0 font-mono pt-0.5">[{log.date.slice(4)}]</span>
                            <span className={`shrink-0 rounded-sm px-1.5 py-0.5 border font-bold ${log.type === '軍令' ? 'bg-[#3b0f0f] text-red-400 border-red-800' : log.type === '內政' ? 'bg-[#0f291e] text-green-400 border-green-800' : 'bg-[#3b2d0f] text-yellow-400 border-yellow-800'}`}>
                              {log.type}
                            </span>
                            <span className="text-[#e3dac9] flex-1 leading-relaxed">{log.msg}</span>
                          </div>
                        ))
                      }
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'tavern' && (
                <div className="max-w-4xl mx-auto p-4 flex flex-col h-full overflow-y-auto pb-6 w-full">
                  <div className="bg-[#1a1410] border border-[#4a3525] p-5 mb-5 shadow-lg relative flex flex-col md:flex-row justify-between items-center gap-4">
                    <div className="absolute inset-0 bg-wood opacity-30 pointer-events-none"></div>
                    <div className="relative z-10 text-center md:text-left flex-1">
                      <h2 className="text-[#d4af37] font-bold text-xl md:text-2xl mb-2 flex items-center justify-center md:justify-start gap-2 tracking-widest">
                        <ICONS.Users className="w-5 h-5"/> 招賢館
                      </h2>
                      <p className="text-[10px] md:text-xs text-[#a3947c] leading-relaxed">
                        設宴招攬天下群雄 (每次 <span className="text-yellow-400 font-bold">300 軍功</span>)。
                      </p>
                    </div>
                    <div className="relative z-10 bg-[#0a0705] border border-[#4a3525] p-3 rounded-sm flex flex-col items-center min-w-[140px] w-full md:w-auto">
                      <div className="text-[10px] text-[#8c7e6a] tracking-widest mb-1">軍功庫存</div>
                      <div className="text-2xl font-bold text-yellow-400 font-mono mb-3">{merit.toFixed(0)}</div>
                      <button onClick={drawOfficer} disabled={merit < 300}
                        className={`w-full py-2.5 font-bold text-sm md:text-base border rounded-sm transition-all tracking-widest
                          ${merit >= 300 ? 'bg-[#2a2218] text-[#d4af37] border-[#b8860b] hover:bg-[#3a2f22] active:scale-95' : 'bg-[#110a05] border-[#2a1a15] text-[#5c4033] cursor-not-allowed'}`}>
                        設宴 (300)
                      </button>
                    </div>
                  </div>

                  <div className="mb-6">
                    <h3 className="text-[#e3dac9] font-bold text-sm md:text-base tracking-widest border-l-4 border-[#b8860b] pl-2 mb-3 flex items-center gap-2">
                      <ICONS.Link className="w-4 h-4"/> 英雄羈絆
                    </h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {BONDS.map(bond => {
                        const isActive = bond.req.every(reqId => ownedOfficers.includes(reqId));
                        return (
                          <div key={bond.id} className={`p-3 border rounded-sm relative overflow-hidden transition-colors ${isActive ? 'bg-[#2a2218] border-[#d4af37]' : 'bg-[#0a0705] border-[#2a1a15]'}`}>
                            {isActive && <div className="absolute right-[-20px] top-[10px] transform rotate-45 bg-[#b8860b] text-black text-[9px] font-bold py-0.5 w-24 text-center">已解鎖</div>}
                            <h4 className={`font-bold text-sm mb-1 tracking-widest ${isActive ? 'text-[#d4af37]' : 'text-[#8c7e6a]'}`}>{bond.name}</h4>
                            <p className={`text-[10px] ${isActive ? 'text-[#e3dac9]' : 'text-[#5c4033]'}`}>{bond.desc}</p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  
                  <div className="flex justify-between items-end mb-3 border-b border-[#3e2723] pb-2 px-1">
                    <h3 className="text-[#e3dac9] font-bold text-sm md:text-base tracking-widest">麾下名將</h3>
                    <span className="text-[10px] md:text-xs text-[#8c7e6a] font-mono">{ownedOfficers.length} / {OFFICERS.length}</span>
                  </div>
                  <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2 md:gap-3">
                    {ownedOfficers.length === 0 ? <div className="col-span-full py-10 text-center text-[#5c4033] text-xs">尚無將領，大營空虛。</div> : 
                      [...ownedOfficers].reverse().map(id => {
                        const officer = OFFICERS.find(o => o.id === id);
                        if(!officer) return null;
                        return (
                          <div key={id} className={`bg-[#0a0705] border p-2 flex flex-col items-center relative overflow-hidden ${officer.border}`}>
                            <div className={`absolute top-0 right-0 px-1.5 py-0.5 text-[8px] font-black ${officer.bg} ${officer.color} border-b border-l ${officer.border}`}>{officer.faction}</div>
                            <div className={`text-xs md:text-sm font-bold mt-4 mb-1 tracking-widest ${officer.color}`}>{officer.name}</div>
                            <div className="text-[9px] text-[#a3947c]">{officer.type} <span className="text-white font-mono">{officer.stat}</span></div>
                          </div>
                        );
                      })
                    }
                  </div>
                </div>
              )}

              {activeTab === 'ledger' && (
                <div className="max-w-4xl mx-auto p-4 flex flex-col h-full overflow-y-auto pb-6 w-full">
                  <div className="bg-[#1a1410] border border-[#4a3525] p-4 md:p-5 mb-5 shadow-lg">
                    <h2 className="text-[#d4af37] font-bold text-lg md:text-xl mb-2 flex items-center gap-2 tracking-widest">
                      <ICONS.Scroll className="w-5 h-5"/> 兵力編制 (手動校準)
                    </h2>
                    <p className="text-[10px] md:text-xs text-[#a3947c] leading-relaxed p-3 bg-[#0a0705] border border-[#3e2723]">
                      請在此如實登記各路兵馬真實數量。修改數值並點擊空白處即自動存入本機記憶體。
                    </p>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    {Object.keys(DEFAULT_GAME_STATE.assets).map(key => (
                      <div key={key} className="bg-[#1a1410] border border-[#4a3525] p-3 focus-within:border-[#d4af37] transition-colors relative">
                        <label className="text-[10px] md:text-xs font-bold tracking-widest text-[#a3947c] mb-2 flex justify-between border-b border-[#3e2723] pb-1 uppercase">
                          <span>{ key === 'twd' ? '活存現金' : key === 'emergency' ? '預備金' : key === 'entertainment' ? '娛樂金' : key === 'debt' ? '信貸' : key }</span>
                        </label>
                        <input type="number" step="any" value={displayAssets[key] === 0 ? '' : displayAssets[key]}
                          onChange={(e) => handleAssetChange(key, e.target.value === '' ? 0 : parseFloat(e.target.value))}
                          onBlur={handleAssetBlur}
                          className={`w-full bg-[#0a0705] border border-[#3e2723] p-2 text-right text-sm md:text-base focus:outline-none focus:border-[#d4af37] font-mono shadow-inner ${key === 'debt' ? 'text-red-400' : 'text-[#e3dac9]'}`} />
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </div>
          </main>

          <nav className="bg-[#1a1410] border-t border-[#3e2723] flex justify-around items-center shrink-0 h-16 pb-safe z-40 relative shadow-[0_-5px_15px_rgba(0,0,0,0.5)]">
            {[
              { id: 'map', label: '大勢', icon: ICONS.Map },
              { id: 'command', label: '軍令', icon: ICONS.Tent },
              { id: 'tavern', label: '招賢', icon: ICONS.Users },
              { id: 'ledger', label: '編制', icon: ICONS.Scroll },
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                className={`flex flex-col items-center justify-center w-full h-full transition-colors relative ${activeTab === tab.id ? 'text-[#d4af37]' : 'text-[#5c4033] hover:text-[#8c7e6a]'}`}>
                {activeTab === tab.id && <div className="absolute top-0 w-8 h-0.5 bg-[#d4af37]"></div>}
                <div className={`w-5 h-5 mb-1 ${activeTab === tab.id ? 'animate-bounce' : ''}`} style={{animationDuration: '2s'}}><tab.icon className="w-full h-full" /></div>
                <span className="text-[10px] font-bold tracking-widest">{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    // 啟動引擎：把畫面渲染出來
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
