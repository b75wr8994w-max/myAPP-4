    const AnimatedNumber = ({ value, formatter }) => {
      const [displayValue, setDisplayValue] = useState(value);
      useEffect(() => {
        let start = displayValue;
        let end = value;
        if (start === end) return;
        let startTime = null;
        const duration = 800; 
        const animate = (timestamp) => {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          setDisplayValue(start + (end - start) * easeOut);
          if (progress < 1) requestAnimationFrame(animate);
          else setDisplayValue(end);
        };
        requestAnimationFrame(animate);
      }, [value]);
      return <>{formatter ? formatter(displayValue) : Math.floor(displayValue)}</>;
    };

      const handlePayday = () => {
        if (lastInvestMonth === currentMonthString) {
          showToast("本月軍令已下達！將軍，請靜候下月。", 'warn');
          return;
        }
        if (investPlan.amount <= 0 && investPlan.repayAmount <= 0) {
          showToast("請輸入欲調度的糧草或償還數量！", 'warn');
          return;
        }
        if (!['btc', 'qqq', 'voo'].includes(investPlan.target)) {
          showToast("軍令錯誤：只能定投 BTC, QQQ, VOO。", 'error');
          return;
        }

        let newState = JSON.parse(JSON.stringify(gameState));
        const amount = investPlan.amount;
        const repayAmount = investPlan.repayAmount;
        const target = investPlan.target;
        
        let addedAmount = amount;
        if (target === 'btc') addedAmount = amount / prices.btc;
        
        if (amount > 0) newState.assets[target] = (newState.assets[target] || 0) + addedAmount;
        if (repayAmount > 0) newState.assets.debt = Math.max(0, (newState.assets.debt || 0) - repayAmount);

        newState.investCount += 1;
        newState.lastInvestMonth = currentMonthString;
        
        const baseEvent = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
        
        const hasFamilyPolicy = (newState.policies || []).includes('p_family');
        let gainedMerit = Math.floor((300 + officerStats.passiveBuff + bondPaydayBuff + baseEvent.merit) * (hasFamilyPolicy ? 1.2 : 1));
        
        newState.merit += gainedMerit;

        // 【隨機機制】25% 機率觸發雲遊黑市
        if (Math.random() <= 0.25) {
            const types = ['buy_mat', 'sell_mat'];
            const t = types[Math.floor(Math.random() * types.length)];
            if (t === 'buy_mat') {
                newState.activeBlackMarket = { type: 'buy_mat', desc: '以 100 軍功兌換 5 個鍛造素材', costMerit: 100, rewardMat: 5 };
            } else {
                newState.activeBlackMarket = { type: 'sell_mat', desc: '以 3 個素材兌換 150 軍功', costMat: 3, rewardMerit: 150 };
            }
            setTimeout(() => showToast("📢 探子回報：大營外來了一位雲遊商人！", "warn"), 2000);
        } else {
            newState.activeBlackMarket = null;
        }

        if (repayAmount > 0) logMsg += `遣散傭兵(償還信貸) ${repayAmount.toLocaleString()}。`;
        logMsg += `軍功 +${gainedMerit}。`;

        addLog(newState, '軍令', logMsg);
        saveGameState(newState);
        
        const interactiveEvent = INTERACTIVE_EVENTS[Math.floor(Math.random() * INTERACTIVE_EVENTS.length)];
        setActiveEncounter({ baseEvent, interactiveEvent });
      };

         if (bm.type === 'buy_mat') {
             if (newState.merit < bm.costMerit) return showToast("軍功不足，商人搖頭拒絕。", "error");
             newState.merit -= bm.costMerit;
             newState.materials = (newState.materials || 0) + bm.rewardMat;
         } else {
             if ((newState.materials || 0) < bm.costMat) return showToast("素材不足，商人搖頭拒絕。", "error");
             newState.materials -= bm.costMat;
             newState.merit += bm.rewardMerit;
         }
         
         newState.activeBlackMarket = null; 
         addLog(newState, '奇遇', `與黑市商人交易成功，各取所需！`);

          addLog(newState, '奇遇', msg);

        saveGameState(newState);
        setActiveEncounter(null);

      const handleForge = (item) => {
        const hasCooldownPolicy = (gameState.policies || []).includes('p_cooldown');
        const finalCost = hasCooldownPolicy ? Math.max(1, Math.floor(item.cost * 0.9)) : item.cost;
        
        if ((gameState.materials || 0) < finalCost) {
            showToast("庫房素材不足！", "error");
            return;
        }
        let newState = JSON.parse(JSON.stringify(gameState));
        let logMsg = `巧匠成功打造神兵【${item.name}】！全軍戰力永久提升 ${(item.bonus * 100)}%。`;

        // 【隨機機制】15% 機率觸發神工鍛造
        if (Math.random() <= 0.15) {
            const refund = Math.ceil(finalCost / 2);
            newState.materials -= (finalCost - refund);
            newState.merit += 100;
            logMsg = `【神工暴擊】打造出完美無瑕的【${item.name}】！節省了 ${refund} 素材並獲賞 100 軍功！`;
            showToast("✨ 觸發神工鍛造暴擊！", "success");

            newState.materials -= finalCost;
            showToast(`成功鍛造 ${item.name}！`, "success");

        newState.equipments = [...(newState.equipments || []), item.id];
        addLog(newState, '鍛造', logMsg);
        saveGameState(newState);

        const prov = provincesState.find(p => p.id === selectedProvinceId);
        if (prov && prov.isConquered) {
            showToast("此城池已在我軍控制之下，無需重複攻打！", "warn");
            return;
        }
        if (!prov || siegeGenerals.length === 0) return showToast("請至少派遣一名將領出征！", 'warn');

        const basePower = Math.max(1, stats.netWorth / 10000); 
        const investDisciplineBuff = 1 + (investCount * 0.005);
        
        let generalMultiplier = 0;
        siegeGenerals.forEach(id => {
          const lvl = officerStats.roster[id];
          const off = OFFICERS.find(o => o.id === id);
          generalMultiplier += (off.stat / 200) * (1 + (lvl - 1) * 0.25); 
        });

        const equipMultiplier = (equipments || []).length * 0.05;

        let synergyMultiplier = 0;
        SYNERGIES.forEach(syn => {
           if (syn.req.every(reqId => (equipments || []).includes(reqId))) {
               synergyMultiplier += syn.bonus;
           }
        });

        const hasNoDebtPolicy = (policies || []).includes('p_nodebt');
        const policyPowerBuff = (hasNoDebtPolicy && displayAssets.debt === 0) ? 0.1 : 0;
        
        // 主將加成結算
        const mainOffExp = (officerExps || {})[mainOfficerId] || 0;
        const mainOffBuff = mainOfficerId ? Math.floor(mainOffExp / 10) * 0.01 : 0;

        let weatherMod = 1;
        if (weather.trend === 'bull') weatherMod = 1.2;
        if (weather.trend === 'bear') {
           const hasDiamond = (policies || []).includes('p_diamond');
           // 加入諸葛亮主將技能抵抗
           const zhugeResist = (mainOfficerId === 27) ? 0.15 : 0;
           weatherMod = (hasDiamond ? 1.1 : 0.9) + zhugeResist;
        }

        const totalAttack = Math.floor(basePower * investDisciplineBuff * (1 + generalMultiplier + equipMultiplier + synergyMultiplier + policyPowerBuff + mainOffBuff) * weatherMod);
        const defense = prov.def;
        
        let newState = JSON.parse(JSON.stringify(gameState));
        let logMsg = "";
        let success = false;

        if (totalAttack >= defense) {
          success = true;
          if (!newState.occupiedProvinces.includes(prov.id)) {
             newState.occupiedProvinces.push(prov.id);
          }
          const rewardMerit = 200 + Math.floor(defense * 0.3);

             if (!newState.ownedOfficers.includes(prov.rewardId)) {
                 newState.ownedOfficers.push(prov.rewardId);
                 const rewardOfficer = OFFICERS.find(o => o.id === prov.rewardId);
                 logMsg += ` 順利收服【${rewardOfficer.name}】加入大營！`;
                 setTimeout(() => showToast(`🎊 成功收服史詩妖獸：${rewardOfficer.name}！`, 'success'), 1000);

          logMsg = `【惜敗】我軍戰力 ${totalAttack} 不敵 ${prov.name} 守軍(${defense})，鎩羽而歸。`;
        }
        
        addLog(newState, '征戰', logMsg);
        saveGameState(newState);
        setCombatResult({ success, totalAttack, defense, provName: prov.name, logMsg });

              <div className="max-w-4xl mx-auto p-4 flex flex-col h-full overflow-y-auto pb-6 w-full">
                
                <div className="bg-metal-dark border border-[#4a3525] p-4 md:p-5 mb-5 shadow-lg">
                  <h2 className="text-gold font-bold text-lg md:text-xl mb-2 flex items-center gap-2 tracking-widest whitespace-nowrap">
                    <ICONS.Scroll className="w-5 h-5"/> 兵力編制 (手動校準)
                  </h2>
                  <p className="text-[10px] md:text-xs text-[#a3947c] leading-relaxed p-3 bg-black border border-[#3e2723] shadow-inner">
                    將軍，請在此登記載路兵馬的數量。<br/>
                    <span className="text-red-400">注意：</span> 步弩兵(QQQ/VOO)已直接採用等值台幣現值，修改數值並點擊空白處即自動存入本機記憶體。加密貨幣將與即時價格連動，動態反映總戰力。
                  </p>
                </div>
                
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                  {Object.keys(DEFAULT_GAME_STATE.assets).map(key => (
                    <div key={key} className={`bg-metal-dark border p-3 transition-colors relative shadow-md
                      ${key === 'debt' ? 'border-red-900 focus-within:border-red-500' : 'border-[#4a3525] focus-within:border-gold'}`}>
                      <label className="text-[10px] md:text-xs font-bold tracking-widest text-[#a3947c] mb-2 flex justify-between border-b border-[#3e2723] pb-1 uppercase whitespace-nowrap">
                        <span className={key === 'debt' ? 'text-red-400' : ''}>{
                          key === 'twd' ? '活存現金' : key === 'emergency' ? '預備金' : key === 'entertainment' ? '娛樂金' :
                          key === 'btc' ? 'BTC (顆數)' : key === 'eth' ? 'ETH (顆數)' : key === 'ada' ? 'ADA (顆數)' :
                          key === 'qqq' ? 'QQQ (台幣現值)' : key === 'voo' ? 'VOO (台幣現值)' : key === 'debt' ? '信貸餘額 (扣除)' : key
                        }</span>
                      </label>
                      <input 
                        type="number" step="any" 
                        value={displayAssets[key] === 0 ? '' : displayAssets[key]}
                        onChange={(e) => {
                          const val = e.target.value === '' ? 0 : parseFloat(e.target.value);
                          handleAssetChange(key, val);
                        }}
                        onBlur={handleAssetBlur}
                        className={`w-full bg-black border border-[#3e2723] p-2 text-right text-sm md:text-base focus:outline-none font-mono shadow-inner
                          ${key === 'debt' ? 'text-red-400 focus:border-red-500' : 'text-[#e3dac9] focus:border-gold'}`}
                      />
                    </div>
                  ))}
                </div>

                <div className="mt-8 bg-metal-dark border border-[#4a3525] p-4 md:p-5 shadow-lg relative">
                  <div className="absolute top-0 left-0 w-1 h-full bg-gold"></div>
                  <h3 className="text-[#e3dac9] font-bold text-sm md:text-base mb-2 flex items-center gap-2 border-b border-[#3e2723] pb-2 tracking-widest whitespace-nowrap">
                    <ICONS.Flame className="w-4 h-4"/> 裝備庫存 (戰力加成)
                  </h3>
                  <div className="flex justify-between items-center mb-3">
                    <span className="text-[10px] md:text-xs text-[#a3947c]">當前擁有: <span className="text-white font-bold">{(equipments || []).length} / {CRAFTABLE_EQUIPMENTS.length}</span>件</span>
                    <span className="text-[10px] md:text-xs text-[#a3947c]">基礎裝備加成: <span className="text-green-400 font-bold font-mono">+{((equipments || []).length * 5)}%</span></span>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {(equipments || []).length === 0 ? (
                      <span className="text-xs text-[#5c4033] py-1">尚無裝備，請至「庫房」進行鍛造。</span>
                    ) : (
                      CRAFTABLE_EQUIPMENTS.filter(eq => (equipments || []).includes(eq.id)).map(eq => (
                        <span key={eq.id} className="text-[10px] md:text-xs px-2 py-1 bg-[#2a2218] border border-gold text-gold rounded-sm whitespace-nowrap shadow-sm">
                          {eq.name}
                        </span>
                      ))
                    )}
                  </div>
                </div>

                <div className="mt-4 bg-metal-dark border border-[#4a3525] p-4 md:p-5 shadow-lg relative">
                  <div className="absolute top-0 left-0 w-1 h-full bg-gray-500"></div>
                  <h3 className="text-[#e3dac9] font-bold text-sm md:text-base mb-2 flex items-center gap-2 border-b border-[#3e2723] pb-2 tracking-widest whitespace-nowrap">
                    兵符閣 (存檔管理)
                  </h3>
                  <p className="text-[10px] md:text-xs text-[#a3947c] mb-4 leading-relaxed p-3 bg-black border border-[#3e2723] shadow-inner">
                    為防天災人禍（如意外清除瀏覽器資料），請定期將兵符（本機存檔）匯出保管。<br/>
                    若移防至新設備，可持舊兵符匯入，延續霸業。舊版兵符匯入後將自動相容新版天象與攻城機制。
                  </p>
                  <div className="flex gap-3">
                    <button onClick={handleExport} className="flex-1 py-3 bg-[#2a2218] text-gold border border-gold rounded-sm font-bold tracking-widest hover:bg-[#3a2f22] active:scale-95 flex items-center justify-center gap-2 text-xs md:text-sm transition-all whitespace-nowrap shadow-md">
                      <ICONS.Download className="w-4 h-4" /> 匯出兵符
                    </button>
                    <button onClick={() => fileInputRef.current.click()} className="flex-1 py-3 bg-black text-[#a3947c] border border-[#4a3525] rounded-sm font-bold tracking-widest hover:bg-[#1a1410] active:scale-95 flex items-center justify-center gap-2 text-xs md:text-sm transition-all whitespace-nowrap shadow-md">
                      <ICONS.Upload className="w-4 h-4" /> 匯入兵符
                    </button>
                    <input type="file" accept=".json" ref={fileInputRef} onChange={handleImport} className="hidden" />
                  </div>
                  
                  {/* 新增：生成戰報按鈕 */}
                  <button onClick={() => setShowReportPreview(true)} className="w-full mt-3 py-3 bg-[#0f172a] text-blue-300 border border-blue-700 rounded-sm font-bold tracking-widest hover:bg-[#1e3a8a] active:scale-95 flex items-center justify-center gap-2 text-xs md:text-sm transition-all shadow-[0_0_10px_rgba(59,130,246,0.2)]">
                      <ICONS.Camera className="w-4 h-4" /> 生成霸業戰報 (社群分享)
                  </button>
                </div>
              </div>
            )}

            {/* ================= OUT-OF-TAB MODALS (全域彈窗) ================= */}
            
            {/* 1. 戰報預覽 Modal */}
            {showReportPreview && (
                <div className="fixed inset-0 z-[400] flex items-center justify-center bg-black/95 px-4 backdrop-blur-sm" onClick={() => setShowReportPreview(false)}>
                   <div className="max-w-md w-full flex flex-col items-center" onClick={e => e.stopPropagation()}>
                       <div className="text-[#a3947c] text-xs mb-2 tracking-widest">戰報預覽 (可直接下載分享)</div>
                       
                       {/* 要被截圖的範圍 ref={reportRef} */}
                       <div ref={reportRef} className="w-full bg-[#0c0906] p-6 border-[3px] border-gold relative shadow-[0_0_30px_rgba(212,175,55,0.3)] overflow-hidden font-serif">
                           {/* 背景浮水印 */}
                           <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[120px] font-black opacity-[0.03] pointer-events-none whitespace-nowrap text-gold">富霸天下</div>
                           
                           <h2 className="text-2xl text-center text-gold font-black tracking-widest border-b border-[#3e2723] pb-2 mb-4 drop-shadow-md">【 富 霸 天 下 ． 霸 業 戰 報 】</h2>
                           <div className="text-right text-[10px] text-[#8c7e6a] mb-5 tracking-widest">建安{jianAnYear}年{currentRealMonth}月</div>
                           
                           <div className="flex justify-between items-end mb-6">
                               <div>
                                  <div className="text-xs text-[#a3947c] tracking-widest mb-1">大軍總兵力</div>
                                  <div className="text-3xl font-black text-yellow-400 font-mono drop-shadow-[0_0_5px_rgba(250,204,21,0.5)]">
                                     {(stats.netWorth / 10000).toFixed(0)} <span className="text-sm text-gold font-serif">萬</span>
                                  </div>
                               </div>
                               <div className="text-right flex flex-col items-end">
                                  <div className="text-[10px] text-[#a3947c] tracking-widest mb-1">大營主將</div>
                                  <div className="text-lg font-bold text-red-400 bg-[#3b0f0f] border border-red-800 px-3 py-1 rounded-sm shadow-md">
                                     {mainOfficerId ? `${OFFICERS.find(o => o.id === mainOfficerId)?.name} (Lv.${Math.floor(((officerExps || {})[mainOfficerId] || 0) / 10)})` : '未指派'}
                                  </div>
                               </div>
                           </div>

                           <div className="bg-metal-dark border border-[#4a3525] p-3 mb-5 shadow-inner">
                               <div className="text-[10px] text-gold mb-2 font-bold tracking-widest border-b border-[#3e2723] pb-1">解鎖傳奇成就 ({achievements.length}/5)</div>
                               <div className="flex flex-wrap gap-2">
                                   {achievements.length === 0 ? <span className="text-[10px] text-[#5c4033]">尚未解鎖成就...</span> : 
                                      ACHIEVEMENTS.filter(a => achievements.includes(a.id)).map(ach => (
                                          <div key={ach.id} className="text-[9px] bg-black border border-gold text-yellow-300 px-1.5 py-0.5 flex items-center gap-1 shadow-sm rounded-sm">
                                             <span>{ach.icon}</span> {ach.name}
                                          </div>
                                      ))
                                   }
                               </div>
                           </div>

                           <div className="text-sm text-[#e3dac9] italic border-l-4 border-red-800 pl-3 leading-relaxed tracking-wide bg-gradient-to-r from-[#1a0505] to-transparent p-2">
                               "{getReportQuote()}"
                           </div>
                           
                           <div className="mt-8 text-right text-[8px] text-[#5c4033] tracking-widest font-mono">
                               Generated by 戰略圖 - 富霸天下
                           </div>
                       </div>
                       
                       {/* 彈窗按鈕 */}
                       <div className="flex gap-3 mt-6 w-full">
                           <button onClick={() => setShowReportPreview(false)} className="flex-1 py-3 bg-black text-[#8c7e6a] border border-[#3e2723] font-bold tracking-widest text-sm transition-colors hover:text-white rounded-sm">
                               返回
                           </button>
                           <button onClick={handleGenerateReportImage} className="flex-1 py-3 bg-blue-900 text-blue-200 border border-blue-500 font-bold tracking-widest text-sm transition-all hover:bg-blue-800 active:scale-95 shadow-[0_0_15px_rgba(59,130,246,0.4)] rounded-sm">
                               下載戰報圖片
                           </button>
                       </div>
                   </div>
                </div>
            )}

            {/* 2. 奇遇事件 Modal */}
            {activeEncounter && (
              <div className="fixed inset-0 z-[250] flex items-center justify-center bg-black/90 px-4 backdrop-blur-md">
                <div className="bg-metal-dark border-2 border-gold p-6 max-w-sm w-full shadow-[0_0_40px_rgba(212,175,55,0.3)] animate-[slideUp_0.3s_ease-out] relative">
                  <div className="absolute top-0 left-0 w-full h-1.5 bg-[#b8860b]"></div>
                  <div className="absolute bottom-0 left-0 w-full h-1.5 bg-[#b8860b]"></div>

                  <div className="mb-5 border-b border-[#3e2723] pb-4 text-center">
                    <h2 className="text-[#a3947c] text-xs font-bold tracking-widest mb-2 flex justify-center items-center gap-2">
                       <span className="w-4 h-px bg-[#4a3525]"></span> 本月軍情 <span className="w-4 h-px bg-[#4a3525]"></span>
                    </h2>
                    <div className={`inline-block px-3 py-1 border rounded-sm text-sm md:text-base font-bold mb-3 shadow-md
                      ${activeEncounter.baseEvent.type === 'good' ? 'bg-[#0f291e] text-green-400 border-green-800' :
                        activeEncounter.baseEvent.type === 'bad' ? 'bg-[#3b0f0f] text-red-400 border-red-800' :
                        'bg-[#1c1814] text-gray-300 border-gray-600'}`}>
                      {activeEncounter.baseEvent.title}
                    </div>
                    <p className="text-[#e3dac9] text-xs md:text-sm leading-relaxed">{activeEncounter.baseEvent.msg}</p>
                  </div>

                  <div className="text-center mt-2">
                    <h3 className="text-red-400 text-lg md:text-xl font-black tracking-widest mb-2 drop-shadow-md animate-pulse">【 突發奇遇 】</h3>
                    <h4 className="text-gold font-bold text-sm md:text-base mb-3">{activeEncounter.interactiveEvent.title}</h4>
                    <p className="text-[#a3947c] text-[10px] md:text-xs leading-relaxed mb-6 bg-black p-3 border border-[#3e2723] text-left">
                      {activeEncounter.interactiveEvent.desc}
                    </p>

                    <div className="flex flex-col gap-3">
                      {activeEncounter.interactiveEvent.options.map((opt, i) => (
                        <button key={i} onClick={() => handleEncounterOption(opt.actionId)}
                          className={`w-full py-3 font-bold tracking-widest text-xs md:text-sm border rounded-sm transition-all active:scale-95 whitespace-nowrap
                            ${i === 0 ? 'bg-[#3b0f0f] text-red-100 border-red-700 hover:bg-[#5c0000]' : 'bg-black text-[#8c7e6a] border-[#3e2723] hover:text-white'}`}>
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 3. 武將對話與主將任命 Modal (SLG 視覺) */}
            {activeOfficerDialogue && (
                <div className="fixed inset-0 z-[500] flex items-center justify-center bg-black/80 px-4 backdrop-blur-sm" onClick={() => setActiveOfficerDialogue(null)}>
                   <div className={`border-2 ${activeOfficerDialogue.rareBorder} bg-metal-dark p-6 max-w-sm w-full relative shadow-[0_0_30px_rgba(0,0,0,0.8)] animate-[slideUp_0.2s_ease-out]`} onClick={e => e.stopPropagation()}>
                       <div className="flex justify-between items-start mb-4 border-b border-[#3e2723] pb-2">
                           <div>
                               <div className={`text-xs ${activeOfficerDialogue.color} tracking-widest mb-1`}>{activeOfficerDialogue.faction}軍 | {activeOfficerDialogue.type}</div>
                               <h3 className={`text-3xl font-black ${activeOfficerDialogue.color} tracking-widest`}>{activeOfficerDialogue.name}</h3>
                           </div>
                           <div className="text-right">
                               <div className="text-[9px] text-[#8c7e6a]">星級被動加成</div>
                               <div className="text-green-400 font-mono text-xs">+ {((activeOfficerDialogue.stat/100) * (1 + (officerStats.roster[activeOfficerDialogue.id]-1)*0.2)).toFixed(2)}</div>
                           </div>
                       </div>
                       
                       <div className="bg-black border border-[#3e2723] p-4 text-sm md:text-base leading-relaxed text-[#e3dac9] italic relative shadow-inner mb-4">
                           <span className="absolute top-2 left-2 text-3xl text-[#4a3525] opacity-50 font-serif leading-none">"</span>
                           <span className="relative z-10 pl-4 block">{getOfficerDialogue(activeOfficerDialogue)}</span>
                       </div>

                       {/* 顯示主將專屬奧義 */}
                       {activeOfficerDialogue.skillName && (
                          <div className="bg-[#1a233a] border border-blue-500 p-3 mb-5 shadow-md">
                             <div className="text-blue-300 text-xs font-bold mb-1 tracking-widest">✨ 主將奧義：{activeOfficerDialogue.skillName}</div>
                             <div className="text-[10px] text-gray-300">{activeOfficerDialogue.skillDesc}</div>
                          </div>
                       )}
                       
                       <div className="mt-2 flex gap-2">
                          {!ownedOfficers.includes(activeOfficerDialogue.id) ? (
                              <button disabled className="w-full py-3 font-bold bg-black text-[#5c4033] border border-[#2a1a15] text-xs tracking-widest cursor-not-allowed">
                                  尚未登庸
                              </button>
                          ) : gameState.mainOfficerId === activeOfficerDialogue.id ? (
                              <button className="w-full py-3 font-bold bg-[#2a2218] text-green-400 border border-green-800 text-xs tracking-widest cursor-default">
                                  當前大營主將
                              </button>
                          ) : (
                              <button onClick={() => {
                                  let newState = JSON.parse(JSON.stringify(gameState));
                                  newState.mainOfficerId = activeOfficerDialogue.id;
                                  if(!newState.officerExps) newState.officerExps = {};
                                  if(!newState.officerExps[activeOfficerDialogue.id]) newState.officerExps[activeOfficerDialogue.id] = 0;
                                  addLog(newState, '內政', `任命【${activeOfficerDialogue.name}】為大營主將！`);
                                  saveGameState(newState);
                                  showToast(`已任命 ${activeOfficerDialogue.name} 為主將！`, 'success');
                                  setActiveOfficerDialogue(null);
                              }} className="w-full py-3 font-bold bg-[#3b0f0f] text-red-300 border border-red-700 hover:bg-[#5c0000] transition-colors text-xs tracking-widest active:scale-95 shadow-md">
                                  設為大營主將
                              </button>
                          )}
                          <button onClick={() => setActiveOfficerDialogue(null)} className="w-full py-3 font-bold bg-black text-[#8c7e6a] border border-[#3e2723] hover:text-white transition-colors text-xs tracking-widest shadow-md">
                              結束交談
                          </button>
                       </div>
                   </div>
                </div>
            )}

            {/* 4. 抽卡全螢幕結果 Modal (SLG 動畫) */}
            {gachaResult && (
              <div className="fixed inset-0 z-[999] flex items-center justify-center bg-black/95 backdrop-blur-lg px-4" onClick={() => setGachaResult(null)}>
                <div className={`w-[300px] h-[450px] border-[4px] ${gachaResult.rareBorder} bg-gradient-to-b from-[#1a1a1a] to-black flex flex-col items-center justify-center relative animate-[cardReveal_0.8s_ease-out_forwards] ${gachaResult.stat >= 95 ? 'animate-[cardGlow_2s_infinite]' : ''}`}>
                  
                  {/* 立繪預留 */}
                  {gachaResult.portrait && <img src={gachaResult.portrait} alt={gachaResult.name} className="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-screen" />}
                  
                  <div className={`absolute top-4 left-4 px-3 py-1 text-sm font-black ${gachaResult.bg} ${gachaResult.color} border ${gachaResult.rareBorder} z-10`}>{gachaResult.faction}</div>
                  
                  {gachaResult.isDupe && <div className="absolute -top-6 bg-yellow-600 text-black font-black px-6 py-2 text-sm border-2 border-white animate-bounce tracking-widest z-20 shadow-[0_0_15px_rgba(234,179,8,0.8)]">獲得將魂！星級提升</div>}
                  
                  {/* 若無立繪，顯示書法字 */}
                  {!gachaResult.portrait && <div className={`text-6xl font-black write-vertical ${gachaResult.color} drop-shadow-[0_0_15px_currentColor] z-10`}>{gachaResult.name}</div>}
                  
                  <div className="absolute bottom-6 text-center w-full z-10">
                    <div className="text-gray-400 text-xs tracking-widest mb-1 bg-black/50 mx-10 rounded-full border border-gray-700 py-1">{gachaResult.type}</div>
                    <div className={`text-3xl font-black font-mono ${gachaResult.color} drop-shadow-md`}>{gachaResult.stat}</div>
                  </div>
                </div>
                <div className="absolute bottom-10 text-gray-500 text-sm tracking-widest animate-pulse">點擊任意處繼續</div>
              </div>
            )}

          </main>

          <nav className="bg-metal-dark border-t-2 border-gold flex justify-around items-center shrink-0 h-16 pb-safe z-40 relative shadow-[0_-5px_15px_rgba(0,0,0,0.8)]">
            {[
              { id: 'map', label: '大勢', icon: ICONS.Map },
              { id: 'command', label: '軍令', icon: ICONS.Tent },
              { id: 'policy', label: '國策', icon: ICONS.Flag },
              { id: 'tavern', label: '招賢', icon: ICONS.Users },
              { id: 'forge', label: '庫房', icon: ICONS.Flame }, 
              { id: 'ledger', label: '編制', icon: ICONS.Scroll },
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                className={`flex flex-col items-center justify-center w-full h-full transition-colors relative
                  ${activeTab === tab.id ? 'text-gold' : 'text-[#5c4033] hover:text-[#8c7e6a]'}`}
              >
                {activeTab === tab.id && <div className="absolute top-0 w-8 h-1 bg-gold shadow-[0_0_10px_rgba(212,175,55,1)]"></div>}
                <div className={`w-4 h-4 md:w-5 md:h-5 mb-1 ${activeTab === tab.id ? 'scale-110 drop-shadow-[0_0_5px_currentColor]' : ''}`} style={{animationDuration: '2s'}}><tab.icon className="w-full h-full" /></div>
                <span className="text-[9px] md:text-[10px] font-bold tracking-widest whitespace-nowrap">{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
