      { id: 105, name: '西楚霸王', stat: 105, type: '武力' }, { id: 106, name: '兵仙韓信', stat: 100, type: '統帥' }, { id: 107, name: '謀聖張良', stat: 100, type: '智力' }, { id: 108, name: '絕代虞姬', stat: 100, type: '魅力'}
    ];

    const OFFICERS = RAW_OFFICERS.map(o => {
      let faction = '群'; let color = 'text-gray-300'; let bg = 'bg-gray-900'; let border = 'border-gray-600';
      if (o.id <= 25) { faction = '魏'; color = 'text-blue-300'; bg = 'bg-blue-950/60'; border = 'border-blue-700'; }
      else if (o.id <= 50) { faction = '蜀'; color = 'text-green-300'; bg = 'bg-green-950/60'; border = 'border-green-700'; }
      else if (o.id <= 75) { faction = '吳'; color = 'text-red-300'; bg = 'bg-red-950/60'; border = 'border-red-700'; }
      else if (o.id > 100 && o.id !== 103) { 
        faction = '神'; color = 'text-yellow-300'; bg = 'bg-yellow-900/60'; border = 'border-yellow-400'; 
      }
      return { ...o, faction, color, bg, border };
    });

    // 羈絆加成已更新為 +5 / +10
    const BONDS = [
      { id: 'taoyuan', name: '桃園結義', req: [26, 28, 29], desc: '劉關張齊聚。每次徵兵額外 +5 軍功。', bonusPayday: 5, bonusRoutine: 0 },
      { id: 'wuhu', name: '五虎上將', req: [28, 29, 30, 31, 32], desc: '蜀國最強戰力。每次徵兵額外 +5 軍功。', bonusPayday: 5, bonusRoutine: 0 },
      { id: 'wuzi', name: '五子良將', req: [5, 16, 15, 11, 10], desc: '魏國前線棟樑。每次徵兵額外 +5 軍功。', bonusPayday: 5, bonusRoutine: 0 },
      { id: 'erqiao', name: '江東二喬', req: [71, 72], desc: '絕世美人。每月巡視額外 +10 軍功。', bonusPayday: 0, bonusRoutine: 10 },
      { id: 'wolongfengchu', name: '臥龍鳳雛', req: [27, 33], desc: '得一可安天下。每次徵兵額外 +5 軍功。', bonusPayday: 5, bonusRoutine: 0 },
      { id: 'lubudiaochan', name: '英雄美人', req: [76, 77], desc: '呂布與貂蟬。每月巡視額外 +10 軍功。', bonusPayday: 0, bonusRoutine: 10 },
      { id: 'sunjianzi', name: '江東猛虎', req: [59, 60, 51], desc: '孫家父子。每次徵兵額外 +5 軍功。', bonusPayday: 5, bonusRoutine: 0 },
      { id: 'han_trinity', name: '漢初三傑', req: [104, 106, 107], desc: '張良、蕭何、韓信齊聚。兵法內政登峰造極！每次徵兵額外 +5 軍功。', bonusPayday: 5, bonusRoutine: 0 },
      { id: 'chu_han', name: '霸王別姬', req: [105, 108], desc: '項羽與絕世佳人。戰鬥力突破天際。每月巡視額外 +10 軍功。', bonusPayday: 0, bonusRoutine: 10 },
    ];

    const TITLES = [
      { rank: '平民', min: 0 }, { rank: '縣令', min: 1000000 }, { rank: '太守', min: 3000000 },
      { rank: '刺史', min: 10000000 }, { rank: '州牧', min: 30000000 }, { rank: '大將軍', min: 50000000 },
      { rank: '魏王', min: 100000000 }, { rank: '皇帝', min: 200000000 }
    ];

    const ICONS = {
      Castle: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M4 21h16v-6h-2v4H6v-4H4v6zm14-10V5l-6 3-6-3v6l6 3 6-3z"/></svg>,
      Sword: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5m-3.5-3.5 4-4L22 4V1h-3l-4.5 4.5"/></svg>,
      Scroll: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><line x1="10" x2="16" y1="6" y2="6"/><line x1="10" x2="16" y1="10" y2="10"/></svg>,
      Map: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6z"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>,
      Tent: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 21h18M12 3l9 18M12 3L3 21"/><path d="M12 3v18M8 13h8"/></svg>,
      Users: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      Download: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
      Upload: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
      Link: ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
    };

    function App() {
      // 升級至 v3 獨立存檔
      const [gameState, setGameState] = useState(() => {
        const saved = localStorage.getItem('wealth_game_save_v3');
        let parsed = saved ? JSON.parse(saved) : DEFAULT_GAME_STATE;
        if (!parsed.occupiedProvinces) parsed.occupiedProvinces = [];
        return parsed;
      });
      
      const [prices, setPrices] = useState(FALLBACK_PRICES);
      const [weather, setWeather] = useState({ trend: 'neutral', change: 0, desc: '風平浪靜' });
      
      const [investPlan, setInvestPlan] = useState({ amount: 10000, repayAmount: 0, target: 'btc' });
      const [activeTab, setActiveTab] = useState('map');
      const [selectedProvinceId, setSelectedProvinceId] = useState(PROVINCES[0].id);
      const [syncStatus, setSyncStatus] = useState('推進中');
      
      // 攻城系統狀態
      const [siegeMode, setSiegeMode] = useState(false);
      const [siegeGenerals, setSiegeGenerals] = useState([]);
      const [combatResult, setCombatResult] = useState(null);

      const [gachaResult, setGachaResult] = useState(null);
      const [activeEvent, setActiveEvent] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [localAssets, setLocalAssets] = useState(null);
      const [mapZoom, setMapZoom] = useState(1);

      const fileInputRef = useRef(null);

      const realDate = new Date();
      const currentRealYear = realDate.getFullYear();
      const currentRealMonth = realDate.getMonth() + 1;
      const currentMonthString = `${currentRealYear}-${String(currentRealMonth).padStart(2, '0')}`;
      const jianAnYear = Math.max(0, currentRealYear - 2026);

      useEffect(() => {
        const fetchPricesAndWeather = async () => {
          try {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,cardano&vs_currencies=twd&include_24hr_change=true');
            if (res.ok) {
              const data = await res.json();
              setPrices(prev => ({
                ...prev, 
                btc: data.bitcoin?.twd || prev.btc, 
                eth: data.ethereum?.twd || prev.eth, 
                ada: data.cardano?.twd || prev.ada,
              }));
              
              const btcChange = data.bitcoin?.twd_24h_change || 0;
              if (btcChange >= 2) setWeather({ trend: 'bull', change: btcChange, desc: '紫微星明 (戰力+20%)' });
              else if (btcChange <= -2) setWeather({ trend: 'bear', change: btcChange, desc: '天狗食月 (戰力-10%)' });
              else setWeather({ trend: 'neutral', change: btcChange, desc: '風平浪靜' });
            }
          } catch (error) {}
        };
        fetchPricesAndWeather();
      }, []);

      const { assets, merit, ownedOfficers, occupiedProvinces, investCount, lastInvestMonth, lastRoutineMonth, logs } = gameState;
      const displayAssets = localAssets || assets;

      // 總資產計算 (扣除信貸)
      const stats = useMemo(() => {
        const crypto = (displayAssets.btc * prices.btc) + (displayAssets.eth * prices.eth) + (displayAssets.ada * prices.ada);
        const trad = displayAssets.qqq + displayAssets.voo; 
        const cash = displayAssets.twd + displayAssets.emergency + displayAssets.entertainment;
        const netWorth = crypto + trad + cash - displayAssets.debt;
        return { crypto, trad, cash, netWorth, debt: displayAssets.debt };
      }, [displayAssets, prices]);

      const playerTitle = useMemo(() => {
        let currentTitle = TITLES[0].rank;
        for (let t of TITLES) {
          if (stats.netWorth >= t.min) currentTitle = t.rank;
        }
        return currentTitle;
      }, [stats.netWorth]);

      // 武將星級與加成 (持有數量 = 星級)
      const officerStats = useMemo(() => {
        let totalPassiveBuff = 0;
        const roster = {}; 
        ownedOfficers.forEach(id => { roster[id] = (roster[id] || 0) + 1; });
        
        Object.entries(roster).forEach(([idStr, level]) => {
          const off = OFFICERS.find(o => o.id === parseInt(idStr));
          if (off) totalPassiveBuff += (off.stat / 100) * (1 + (level - 1) * 0.2); 
        });
        
        return { roster, passiveBuff: totalPassiveBuff };
      }, [ownedOfficers]);

      const activeBonds = useMemo(() => {
        const uniqueOwned = [...new Set(ownedOfficers)];
        return BONDS.filter(bond => bond.req.every(reqId => uniqueOwned.includes(reqId)));
      }, [ownedOfficers]);

      const bondPaydayBuff = useMemo(() => activeBonds.reduce((acc, bond) => acc + bond.bonusPayday, 0), [activeBonds]);
      const bondRoutineBuff = useMemo(() => activeBonds.reduce((acc, bond) => acc + bond.bonusRoutine, 0), [activeBonds]);

      // 結算城池條件與佔領狀態
      const provincesState = useMemo(() => {
        return PROVINCES.map(prov => {
          let isReqMet = true;
          for (const [key, reqVal] of Object.entries(prov.req)) {
            let current = 0;
            if (key === 'netWorth') current = stats.netWorth;
            else if (key === 'investCount') current = investCount;
            else if (key === 'debt') current = displayAssets.debt;
            else current = displayAssets[key] || 0;

            if (key === 'debt') { if (current > reqVal) isReqMet = false; }
            else { if (current < reqVal) isReqMet = false; }
          }
          const isConquered = occupiedProvinces.includes(prov.id);
          return { ...prov, isReqMet, isConquered };
        });
      }, [displayAssets, stats, investCount, occupiedProvinces]);

      const showToast = (msg, type = 'info') => {
        setToastMessage({ msg, type });
        setTimeout(() => setToastMessage(null), 3500);
      };

      const saveGameState = (newState) => {
        setGameState(newState);
        localStorage.setItem('wealth_game_save_v3', JSON.stringify(newState));
        setSyncStatus('已儲存本機');
        setTimeout(() => setSyncStatus('推進中'), 2000);
      };

      // 城池動態失守系統
      useEffect(() => {
        if (!provincesState || provincesState.length === 0) return;
        let lostNames = [];
        let nextOccupied = [...occupiedProvinces];

        provincesState.forEach(prov => {
          if (prov.isConquered && !prov.isReqMet) {
            lostNames.push(prov.name);
            nextOccupied = nextOccupied.filter(id => id !== prov.id);
          }
        });

        if (lostNames.length > 0) {
          setGameState(prev => {
            const newState = JSON.parse(JSON.stringify(prev));
            newState.occupiedProvinces = nextOccupied;
            const dateStr = `建安${jianAnYear}年${currentRealMonth}月`;
            newState.logs = [{ 
              date: dateStr, type: '戰報', 
              msg: `【城池失守】大盤震盪/軍資萎縮，防線空虛，敵軍趁機奪回了 ${lostNames.join('、')}！` 
            }, ...(newState.logs || [])].slice(0, 50);
            
            localStorage.setItem('wealth_game_save_v3', JSON.stringify(newState));
            return newState;
          });
          showToast(`警告！${lostNames.join('、')} 遭敵軍奪回！`, 'error');
        }
      }, [displayAssets, stats, investCount]);

      const addLog = (newState, type, msg) => {
        const dateStr = `建安${jianAnYear}年${currentRealMonth}月`;
        newState.logs = [{ date: dateStr, type, msg }, ...(newState.logs || [])].slice(0, 50);
      };

      const handlePayday = () => {
        if (lastInvestMonth === currentMonthString) {
          showToast("本月軍令已下達！將軍，請靜候下月。", 'warn');
          return;
        }
        if (investPlan.amount <= 0 && investPlan.repayAmount <= 0) {
          showToast("請輸入欲調度的糧草或償還數量！", 'warn');
          return;
        }
        if (!['btc', 'qqq', 'voo'].includes(investPlan.target)) {
          showToast("軍令錯誤：只能定投 BTC, QQQ, VOO。", 'error');
          return;
        }

        let newState = JSON.parse(JSON.stringify(gameState));
        const amount = investPlan.amount;
        const repayAmount = investPlan.repayAmount;
        const target = investPlan.target;
        
        let addedAmount = amount;
        if (target === 'btc') addedAmount = amount / prices.btc;
        
        if (amount > 0) newState.assets[target] = (newState.assets[target] || 0) + addedAmount;
        if (repayAmount > 0) newState.assets.debt = Math.max(0, (newState.assets.debt || 0) - repayAmount);

        newState.investCount += 1;
        newState.lastInvestMonth = currentMonthString;
        
        const ev = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
        let gainedMerit = 50 + officerStats.passiveBuff + bondPaydayBuff + ev.merit; 
        newState.merit += gainedMerit;
        
        const displayAdded = target === 'btc' ? addedAmount.toFixed(6) : addedAmount.toLocaleString();
        let logMsg = `徵兵令下：`;
        if (amount > 0) logMsg += `壯大 ${target.toUpperCase()} 營 ${displayAdded} 兵力。`;
        if (repayAmount > 0) logMsg += `遣散傭兵(償還信貸) ${repayAmount.toLocaleString()}。`;
        logMsg += `軍功 +${gainedMerit.toFixed(1)}。`;

        addLog(newState, '軍令', logMsg);
        saveGameState(newState);
        setActiveEvent(ev); 
      };

      const executeRoutineTask = () => {
        if (lastRoutineMonth === currentMonthString) {
          showToast("本月已巡視過營地。", 'warn');
          return;
        }
        let newState = JSON.parse(JSON.stringify(gameState));
        if (newState.assets.emergency >= 200000 && newState.assets.entertainment >= 50000) {
          let totalGained = 30 + bondRoutineBuff; 
          newState.merit += totalGained;
          newState.lastRoutineMonth = currentMonthString;
          addLog(newState, '內政', `糧草滿編，防禦陣地穩固，獲賞軍功 +${totalGained}。`);
          saveGameState(newState);
          showToast(`巡視完成，軍功 +${totalGained}`, 'success');
        } else {
          showToast("將軍，您的雙防禦（預備金 20萬、娛樂流動金 5萬）尚未滿編！", 'error');
        }
      };

      const drawOfficer = () => {
        if (merit < 300) {
          showToast("軍功不足 300，無法設宴招賢！", 'warn');
          return;
        }
        let newState = JSON.parse(JSON.stringify(gameState));
        newState.merit -= 300; 
        
        const drawn = OFFICERS[Math.floor(Math.random() * OFFICERS.length)];
        const isDupe = newState.ownedOfficers.includes(drawn.id);
        newState.ownedOfficers.push(drawn.id); 
        
        if (isDupe) addLog(newState, '招賢', `獲得將魂！名將【${drawn.name}】星級提升，戰力大增！`);
        else addLog(newState, '招賢', `耗費 300 軍功，登庸名將【${drawn.name}】！`);
        
        saveGameState(newState);
        setGachaResult({ ...drawn, isDupe });
      };

      const executeSiege = () => {
        const prov = provincesState.find(p => p.id === selectedProvinceId);
        
        // 防呆：如果已經佔領，則不允許重複攻打
        if (prov && prov.isConquered) {
            showToast("此城池已在我軍控制之下，無需重複攻打！", "warn");
            setSiegeMode(false);
            return;
        }
        
        if (!prov || siegeGenerals.length === 0) return showToast("請至少派遣一名將領出征！", 'warn');

        // 1. 資產基礎戰力
        const basePower = Math.max(1, stats.netWorth / 10000); 

        // 2. 定投資歷轉化為「全軍軍紀」：每累積定投 1 次，全軍基礎戰力提升 +0.5% (240次可提升 +120%)
        const investDisciplineBuff = 1 + (investCount * 0.005);
        
        // 3. 武將戰力乘區改為 (stat / 200)，三名頂級神將約可提供 +120%~+150% 戰力
        let generalMultiplier = 0;
        siegeGenerals.forEach(id => {
          const lvl = officerStats.roster[id];
          const off = OFFICERS.find(o => o.id === id);
          generalMultiplier += (off.stat / 200) * (1 + (lvl - 1) * 0.25); 
        });

        let weatherMod = 1;
        if (weather.trend === 'bull') weatherMod = 1.2;
        if (weather.trend === 'bear') weatherMod = 0.9;

        // 總戰力 = (基礎資產戰力 * 軍紀加成) * (1 + 武將加成) * 天象
        const totalAttack = Math.floor(basePower * investDisciplineBuff * (1 + generalMultiplier) * weatherMod);
        const defense = prov.def;
        
        let newState = JSON.parse(JSON.stringify(gameState));
        let logMsg = "";
        let success = false;

        if (totalAttack >= defense) {
          success = true;
          // 防呆：確保陣列中沒有重複的城池 ID
          if (!newState.occupiedProvinces.includes(prov.id)) {
             newState.occupiedProvinces.push(prov.id);
          }
          const rewardMerit = 200 + Math.floor(defense * 0.3); 
          newState.merit += rewardMerit;
          logMsg = `【大捷】我軍以 ${totalAttack} 戰力擊破 ${prov.name} 守軍(${defense})，斬獲軍功 ${rewardMerit}！`;
        } else {
          logMsg = `【惜敗】我軍戰力 ${totalAttack} 不敵 ${prov.name} 守軍(${defense})，鎩羽而歸。`;
        }
        
        addLog(newState, '征戰', logMsg);
        saveGameState(newState);
        setCombatResult({ success, totalAttack, defense, provName: prov.name, logMsg });
      };

      const toggleSiegeGeneral = (id) => {
        if (siegeGenerals.includes(id)) setSiegeGenerals(siegeGenerals.filter(gid => gid !== id));
        else if (siegeGenerals.length < 3) setSiegeGenerals([...siegeGenerals, id]);
        else showToast("最多只能指派三名將領！", "warn");
      };

      const handleAssetChange = (key, val) => {
        if (!localAssets) setLocalAssets({ ...assets, [key]: val });
        else setLocalAssets({ ...localAssets, [key]: val });
      };

      const handleAssetBlur = () => {
        if (localAssets) {
          let newState = JSON.parse(JSON.stringify(gameState));
          newState.assets = localAssets;
          saveGameState(newState);
          setLocalAssets(null);
          showToast("帳冊已更新至本機", 'success');
        }
      };

      const handleExport = () => {
        const dataStr = JSON.stringify(gameState);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `戰略圖兵符_v3_建安${jianAnYear}年${currentRealMonth}月.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast("兵符已成功匯出備份！", "success");
      };

      const handleImport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            let importedState = JSON.parse(e.target.result);
            if (importedState && importedState.assets && importedState.merit !== undefined) {
              if (!importedState.occupiedProvinces) importedState.occupiedProvinces = [];
              saveGameState(importedState);
              showToast("兵符匯入成功，天下大勢已更新！", "success");
            } else {
              showToast("兵符格式錯誤，無法解讀！", "error");
            }
          } catch (error) { showToast("兵符毀損，無法解讀！", "error"); }
        };
        reader.readAsText(file);
        event.target.value = null; 
      };

      const selectedProvince = provincesState.find(p => p.id === selectedProvinceId);
      const canInvestThisMonth = lastInvestMonth !== currentMonthString;
      const canDoRoutineThisMonth = lastRoutineMonth !== currentMonthString;
      const occupiedCount = occupiedProvinces.length;

      return (

                      <div className="flex flex-col gap-3">
                        <div>
                          <label className="text-[10px] md:text-xs text-[#8c7e6a] mb-1 block tracking-widest whitespace-nowrap">調度糧草 (投入額 TWD)</label>
                          <input type="number" 
                            value={investPlan.amount === 0 ? '' : investPlan.amount}
                            onChange={(e) => setInvestPlan({...investPlan, amount: parseFloat(e.target.value) || 0})}
                            className="w-full bg-[#1c1814] border border-[#4a3525] text-[#e3dac9] p-3 focus:outline-none focus:border-[#d4af37] font-mono text-base text-right rounded-sm"
                          />
                        </div>
                        <div>
                          <label className="text-[10px] md:text-xs text-[#8c7e6a] mb-1 block tracking-widest whitespace-nowrap">訓練精兵 (標的)</label>
                          <select 
                            value={investPlan.target}
                            onChange={(e) => setInvestPlan({...investPlan, target: e.target.value})}
                            className="w-full bg-[#1c1814] border border-[#4a3525] text-[#e3dac9] p-3 focus:outline-none focus:border-[#d4af37] font-bold text-sm rounded-sm appearance-none"
                          >
                            <option value="btc">虎豹騎 (BTC) - 前期主力</option>
                            <option value="qqq">元戎弩 (QQQ) - 中期穩健</option>
                            <option value="voo">重步兵 (VOO) - 後期防禦</option>
                          </select>
                        </div>
                        <div className="mt-2 border-t border-[#3e2723] pt-3">
                          <label className="text-[10px] md:text-xs text-red-400/80 mb-1 block tracking-widest whitespace-nowrap">遣散傭兵 (償還信貸額 TWD)</label>
                          <input type="number" 
                            value={investPlan.repayAmount === 0 ? '' : investPlan.repayAmount}
                            onChange={(e) => setInvestPlan({...investPlan, repayAmount: parseFloat(e.target.value) || 0})}
                            className="w-full bg-[#1c1814] border border-red-900/50 text-red-300 p-3 focus:outline-none focus:border-red-500 font-mono text-base text-right rounded-sm"
                            placeholder="輸入本月額外還款額"
                          />
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={handlePayday} disabled={!canInvestThisMonth}
                      className={`w-full py-3 md:py-4 font-black text-base md:text-lg border rounded-sm transition-all tracking-widest relative overflow-hidden whitespace-nowrap
                        ${canInvestThisMonth 
                          ? 'bg-[#3b0f0f] text-red-100 border-red-700 hover:bg-[#5c0000] active:scale-95 shadow-[0_0_10px_rgba(139,0,0,0.5)]' 
                          : 'bg-[#1c1814] text-[#5c4033] border-[#3e2723] cursor-not-allowed'}`}
                    >
                      <span className="relative z-10">{canInvestThisMonth ? '確認出兵與軍務' : '本月軍令已畢'}</span>
                    </button>
                    
                    <div className="mt-3 flex justify-between items-center text-[10px] md:text-xs bg-[#0a0705] p-2 border border-[#2a1a15]">
                      <span className="text-[#a3947c] whitespace-nowrap">武將被動加成: <span className="text-green-400">+{officerStats.passiveBuff.toFixed(2)}</span></span>
                      <span className="text-[#a3947c] whitespace-nowrap">羈絆軍功加成: <span className="text-yellow-400">+{bondPaydayBuff}</span></span>
                    </div>
                  </div>

                  <div className="bg-[#1a1410] border border-[#4a3525] p-4 shadow-lg flex justify-between items-center">
                    <div>
                      <h3 className="text-[#d4af37] font-bold text-sm md:text-base mb-1 whitespace-nowrap">日常巡視 (雙防禦)</h3>
                      <p className="text-[10px] text-[#8c7e6a] whitespace-nowrap">檢閱預備金 20萬 & 娛樂流動金 5萬</p>
                    </div>
                    <button onClick={executeRoutineTask} disabled={!canDoRoutineThisMonth}
                      className={`px-4 py-2 text-xs md:text-sm font-bold border rounded-sm tracking-widest whitespace-nowrap shrink-0 ml-2
                        ${canDoRoutineThisMonth ? 'bg-[#0f291e] text-green-400 border-green-700 hover:bg-[#14532d] active:scale-95' : 'bg-[#0a0705] text-[#5c4033] border-[#3e2723] cursor-not-allowed'}`}
                    >
                      {canDoRoutineThisMonth ? `檢閱領賞 (+${30 + bondRoutineBuff})` : '已巡視'}
                    </button>
                  </div>

                  <div className="bg-[#1a1410] border border-[#4a3525] p-4 shadow-lg flex-1 min-h-[200px] flex flex-col">
                    <h3 className="text-[#d4af37] text-sm md:text-base font-bold mb-3 flex items-center gap-2 border-b border-[#3e2723] pb-2 tracking-widest shrink-0 whitespace-nowrap">
                      <ICONS.Scroll className="w-4 h-4"/> 烽火紀年錄
                    </h3>
                    <div className="flex-1 overflow-y-auto pr-2 scrollbar-hide space-y-2">
                      {logs.length === 0 ? <p className="text-[#5c4033] text-center mt-6 text-xs whitespace-nowrap">尚無戰事紀錄...</p> : 
                        logs.map((log, i) => (
                          <div key={i} className="flex gap-2 py-2 border-b border-[#2a1a15] items-start text-[10px] md:text-xs">
                            <span className="text-[#8c7e6a] shrink-0 font-mono pt-0.5 whitespace-nowrap">[{log.date.slice(4)}]</span>
                            <span className={`shrink-0 rounded-sm px-1.5 py-0.5 border font-bold whitespace-nowrap
                              ${log.type === '軍令' ? 'bg-[#3b0f0f] text-red-400 border-red-800' : 
                                log.type === '征戰' ? 'bg-purple-900 text-purple-300 border-purple-700' :
                                log.type === '內政' ? 'bg-[#0f291e] text-green-400 border-green-800' : 
                                log.type === '戰報' ? 'bg-red-950 text-red-500 border-red-700 animate-pulse' :
                                log.type === '招賢' ? 'bg-[#3b2d0f] text-yellow-400 border-yellow-800' : 
                                'bg-gray-900 text-gray-400 border-gray-700'}`}>
                              {log.type}
                            </span>
                            <span className={`flex-1 leading-relaxed ${log.type === '戰報' ? 'text-red-400 font-bold' : 'text-[#e3dac9]'}`}>{log.msg}</span>
                          </div>
                        ))
                      }
                    </div>
                  </div>
                </div>
              )}

              {/* ================= TAVERN TAB ================= */}
              {activeTab === 'tavern' && (
                <div className="max-w-4xl mx-auto p-4 flex flex-col h-full overflow-y-auto pb-6 w-full">
                  
                  <div className="bg-[#1a1410] border border-[#4a3525] p-5 mb-5 shadow-lg relative flex flex-col md:flex-row justify-between items-center gap-4">
                    <div className="relative z-10 text-center md:text-left flex-1">
                      <h2 className="text-[#d4af37] font-bold text-xl md:text-2xl mb-2 flex items-center justify-center md:justify-start gap-2 tracking-widest whitespace-nowrap">
                        <ICONS.Users className="w-5 h-5"/> 招賢館 (無盡將魂)
                      </h2>
                      <p className="text-[10px] md:text-xs text-[#a3947c] leading-relaxed">
                        設宴招攬天下群雄 (每次 <span className="text-yellow-400 font-bold whitespace-nowrap">300 軍功</span>)。<br/>
                        <span className="text-white">若招攬到重複武將，將自動轉化為「將魂」提升星級。</span><br/>
                        星級提升能巨幅強化其「每月軍功被動」與「攻城戰力乘區」。
                      </p>
                    </div>
                    
                    <div className="relative z-10 bg-[#0a0705] border border-[#4a3525] p-3 rounded-sm flex flex-col items-center min-w-[140px] w-full md:w-auto shrink-0">
                      <div className="text-[10px] text-[#8c7e6a] tracking-widest mb-1 whitespace-nowrap">軍功庫存</div>
                      <div className="text-2xl font-bold text-yellow-400 font-mono mb-3 whitespace-nowrap">{merit.toFixed(0)}</div>
                      <button onClick={drawOfficer} disabled={merit < 300}
                        className={`w-full py-2.5 font-bold text-sm md:text-base border rounded-sm transition-all tracking-widest whitespace-nowrap
                          ${merit >= 300 ? 'bg-[#2a2218] text-[#d4af37] border-[#b8860b] hover:bg-[#3a2f22] active:scale-95 shadow-[0_0_10px_rgba(184,134,11,0.2)]' : 'bg-[#110a05] border-[#2a1a15] text-[#5c4033] cursor-not-allowed'}`}
                      >
                        設宴招賢 (300)
                      </button>
                    </div>
                  </div>

                  <div className="mb-6">
                    <h3 className="text-[#e3dac9] font-bold text-sm md:text-base tracking-widest border-l-4 border-[#b8860b] pl-2 mb-3 flex items-center gap-2 whitespace-nowrap">
                      <ICONS.Link className="w-4 h-4"/> 英雄羈絆
                    </h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {BONDS.map(bond => {
                        const uniqueOwned = [...new Set(ownedOfficers)];
                        const isActive = bond.req.every(reqId => uniqueOwned.includes(reqId));
                        return (
                          <div key={bond.id} className={`p-3 border rounded-sm relative overflow-hidden transition-colors
                            ${isActive ? 'bg-[#2a2218] border-[#d4af37]' : 'bg-[#0a0705] border-[#2a1a15]'}`}>
                            {isActive && <div className="absolute right-[-20px] top-[10px] transform rotate-45 bg-[#b8860b] text-black text-[9px] font-bold py-0.5 w-24 text-center shadow-lg whitespace-nowrap">已解鎖</div>}
                            <h4 className={`font-bold text-sm mb-1 tracking-widest whitespace-nowrap ${isActive ? 'text-[#d4af37]' : 'text-[#8c7e6a]'}`}>{bond.name}</h4>
                            <p className={`text-[10px] ${isActive ? 'text-[#e3dac9]' : 'text-[#5c4033]'}`}>{bond.desc}</p>
                            <div className="flex gap-1 mt-2 flex-wrap">
                              {bond.req.map(reqId => {
                                const isOwned = uniqueOwned.includes(reqId);
                                const off = OFFICERS.find(o => o.id === reqId);
                                return (
                                  <span key={reqId} className={`text-[9px] px-1 py-0.5 border rounded-sm whitespace-nowrap
                                    ${isOwned ? `border-gray-500 text-gray-300 bg-gray-800` : 'border-[#2a1a15] text-[#4a3525]'}`}>
                                    {off?.name || '?'}
                                  </span>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  
                  <div className="flex justify-between items-end mb-3 border-b border-[#3e2723] pb-2 px-1">
                    <h3 className="text-[#e3dac9] font-bold text-sm md:text-base tracking-widest whitespace-nowrap">麾下名將 (陣容星級)</h3>
                    <span className="text-[10px] md:text-xs text-[#8c7e6a] font-mono whitespace-nowrap">圖鑑解鎖: {Object.keys(officerStats.roster).length} / {OFFICERS.length}</span>
                  </div>
                  
                  <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2 md:gap-3">
                    {Object.keys(officerStats.roster).length === 0 ? <div className="col-span-full py-10 text-center text-[#5c4033] text-xs whitespace-nowrap">尚無將領，大營空虛。</div> : 
                      Object.entries(officerStats.roster).reverse().map(([idStr, level]) => {
                        const id = parseInt(idStr);
                        const officer = OFFICERS.find(o => o.id === id);
                        if(!officer) return null;
                        return (
                          <div key={id} className={`bg-[#0a0705] border p-2 flex flex-col items-center relative overflow-hidden ${officer.border}`}>
                            <div className={`absolute top-0 right-0 px-1.5 py-0.5 text-[8px] font-black whitespace-nowrap ${officer.bg} ${officer.color} border-b border-l ${officer.border}`}>
                              {officer.faction}
                            </div>
                            <div className="absolute top-0 left-0 bg-yellow-600/90 text-black px-1.5 py-0.5 text-[9px] font-black border-b border-r border-yellow-400 whitespace-nowrap">
                              {level} 星
                            </div>
                            <div className={`text-xs md:text-sm font-bold mt-5 mb-1 tracking-widest whitespace-nowrap ${officer.color}`}>{officer.name}</div>
                            <div className="text-[9px] text-[#a3947c] whitespace-nowrap">{officer.type} <span className="text-white font-mono">{officer.stat}</span></div>
                            <div className="w-full border-t border-[#2a1a15] mt-1 pt-1 text-center text-green-500 font-mono text-[9px] whitespace-nowrap">
                              軍功 +{((officer.stat/100) * (1 + (level-1)*0.2)).toFixed(2)}
                            </div>
                          </div>
                        );
                      })
                    }
                  </div>
                </div>
              )}

              {/* 抽卡結果 Modal */}
              {gachaResult && (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/90 backdrop-blur-sm px-4" onClick={() => setGachaResult(null)}>
                  <div className={`border-2 ${gachaResult.border} ${gachaResult.bg} w-full max-w-xs relative shadow-2xl animate-[stampIn_0.4s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]`}>
                    <div className="absolute inset-0 bg-[#0c0906] opacity-80 pointer-events-none mix-blend-multiply"></div>
                    <div className={`absolute inset-0 flex items-center justify-center text-9xl font-black opacity-10 select-none pointer-events-none ${gachaResult.color}`}>
                      {gachaResult.faction}
                    </div>
                    <div className="relative z-10 flex flex-col items-center p-8">
                      {gachaResult.isDupe && (
                        <div className="text-yellow-400 font-black text-sm mb-3 animate-bounce tracking-widest border border-yellow-400 px-3 py-1 bg-yellow-900/50 shadow-[0_0_15px_rgba(234,179,8,0.5)] whitespace-nowrap">
                          ✨ 獲得將魂！星級提升 ✨
                        </div>
                      )}
                      <div className={`text-xs tracking-widest mb-4 font-bold border ${gachaResult.border} px-3 py-1 bg-black/50 whitespace-nowrap ${gachaResult.color}`}>
                        【 {gachaResult.faction}軍將領 】
                      </div>
                      <h3 className={`text-4xl font-black mb-8 tracking-widest whitespace-nowrap ${gachaResult.color} drop-shadow-lg`}>
                        {gachaResult.name}
                      </h3>
                      <div className="w-full bg-[#0a0705]/80 border border-[#3e2723] p-4 mb-4 backdrop-blur-sm">
                        <div className="flex justify-between items-center mb-2 whitespace-nowrap">
                          <span className="text-[#a3947c] text-sm">定位能力</span>
                          <span className="text-[#e3dac9] font-bold">{gachaResult.type} <span className={gachaResult.color}>{gachaResult.stat}</span></span>
                        </div>
                      </div>
                      <p className="text-[#8c7e6a] text-xs mt-2 animate-pulse whitespace-nowrap">點擊任意處收入麾下</p>
                    </div>
                  </div>
                </div>
              )}

              {/* ================= LEDGER TAB ================= */}
              {activeTab === 'ledger' && (
                <div className="max-w-4xl mx-auto p-4 flex flex-col h-full overflow-y-auto pb-6 w-full">
                  
                  <div className="bg-[#1a1410] border border-[#4a3525] p-4 md:p-5 mb-5 shadow-lg">
                    <h2 className="text-[#d4af37] font-bold text-lg md:text-xl mb-2 flex items-center gap-2 tracking-widest whitespace-nowrap">
                      <ICONS.Scroll className="w-5 h-5"/> 兵力編制 (手動校準)
                    </h2>
                    <p className="text-[10px] md:text-xs text-[#a3947c] leading-relaxed p-3 bg-[#0a0705] border border-[#3e2723]">
                      將軍，請在此登記載路兵馬的數量。<br/>
                      <span className="text-red-400">注意：</span> 步弩兵(QQQ/VOO)已直接採用等值台幣現值，修改數值並點擊空白處即自動存入本機記憶體。加密貨幣將與即時價格連動，動態反映總戰力。
                    </p>
                  </div>
                  
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    {Object.keys(DEFAULT_GAME_STATE.assets).map(key => (
                      <div key={key} className={`bg-[#1a1410] border p-3 transition-colors relative 
                        ${key === 'debt' ? 'border-red-900 focus-within:border-red-500' : 'border-[#4a3525] focus-within:border-[#d4af37]'}`}>
                        <label className="text-[10px] md:text-xs font-bold tracking-widest text-[#a3947c] mb-2 flex justify-between border-b border-[#3e2723] pb-1 uppercase whitespace-nowrap">
                          <span className={key === 'debt' ? 'text-red-400' : ''}>{
                            key === 'twd' ? '活存現金' : key === 'emergency' ? '預備金' : key === 'entertainment' ? '娛樂金' :
                            key === 'btc' ? 'BTC (顆數)' : key === 'eth' ? 'ETH (顆數)' : key === 'ada' ? 'ADA (顆數)' :
                            key === 'qqq' ? 'QQQ (台幣現值)' : key === 'voo' ? 'VOO (台幣現值)' : key === 'debt' ? '信貸餘額 (扣除)' : key
                          }</span>
                        </label>
                        <input 
                          type="number" step="any" 
                          value={displayAssets[key] === 0 ? '' : displayAssets[key]}
                          onChange={(e) => {
                            const val = e.target.value === '' ? 0 : parseFloat(e.target.value);
                            handleAssetChange(key, val);
                          }}
                          onBlur={handleAssetBlur}
                          className={`w-full bg-[#0a0705] border border-[#3e2723] p-2 text-right text-sm md:text-base focus:outline-none font-mono shadow-inner
                            ${key === 'debt' ? 'text-red-400 focus:border-red-500' : 'text-[#e3dac9] focus:border-[#d4af37]'}`}
                        />
                      </div>
                    ))}
                  </div>

                  <div className="mt-8 bg-[#1a1410] border border-[#4a3525] p-4 md:p-5 shadow-lg relative">
                    <div className="absolute top-0 left-0 w-1 h-full bg-gray-500"></div>
                    <h3 className="text-[#e3dac9] font-bold text-sm md:text-base mb-2 flex items-center gap-2 border-b border-[#3e2723] pb-2 tracking-widest whitespace-nowrap">
                      兵符閣 (存檔管理)
                    </h3>
                    <p className="text-[10px] md:text-xs text-[#a3947c] mb-4 leading-relaxed p-3 bg-[#0a0705] border border-[#3e2723]">
                      為防天災人禍（如意外清除瀏覽器資料），請定期將兵符（本機存檔）匯出保管。<br/>
                      若移防至新設備，可持舊兵符匯入，延續霸業。舊版兵符匯入後將自動相容新版天象與攻城機制。
                    </p>
                    <div className="flex gap-3">
                      <button onClick={handleExport} className="flex-1 py-3 bg-[#2a2218] text-[#d4af37] border border-[#b8860b] rounded-sm font-bold tracking-widest hover:bg-[#3a2f22] active:scale-95 flex items-center justify-center gap-2 text-xs md:text-sm transition-all whitespace-nowrap">
                        <ICONS.Download className="w-4 h-4" /> 匯出兵符
                      </button>
                      <button onClick={() => fileInputRef.current.click()} className="flex-1 py-3 bg-[#0a0705] text-[#a3947c] border border-[#4a3525] rounded-sm font-bold tracking-widest hover:bg-[#1a1410] active:scale-95 flex items-center justify-center gap-2 text-xs md:text-sm transition-all whitespace-nowrap">
                        <ICONS.Upload className="w-4 h-4" /> 匯入兵符
                      </button>
                      <input type="file" accept=".json" ref={fileInputRef} onChange={handleImport} className="hidden" />
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          <nav className="bg-[#1a1410] border-t border-[#3e2723] flex justify-around items-center shrink-0 h-16 pb-safe z-40 relative shadow-[0_-5px_15px_rgba(0,0,0,0.5)]">
            {[
              { id: 'map', label: '大勢', icon: ICONS.Map },
              { id: 'command', label: '軍令', icon: ICONS.Tent },
              { id: 'tavern', label: '招賢', icon: ICONS.Users },
              { id: 'ledger', label: '編制', icon: ICONS.Scroll },
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                className={`flex flex-col items-center justify-center w-full h-full transition-colors relative
                  ${activeTab === tab.id ? 'text-[#d4af37]' : 'text-[#5c4033] hover:text-[#8c7e6a]'}`}
              >
                {activeTab === tab.id && <div className="absolute top-0 w-8 h-0.5 bg-[#d4af37]"></div>}
                <div className={`w-5 h-5 mb-1 ${activeTab === tab.id ? 'animate-bounce' : ''}`} style={{animationDuration: '2s'}}><tab.icon className="w-full h-full" /></div>
                <span className="text-[10px] font-bold tracking-widest whitespace-nowrap">{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
